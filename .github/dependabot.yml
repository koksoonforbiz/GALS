# SMU checklist item 46 — patch tracking and alerts for application
# dependencies. Dependabot opens PRs for security advisories as they are
# published and for routine version updates weekly; CI's dependency-audit
# job blocks any high/critical advisory that slips through.
version: 2
updates:
  - package-ecosystem: npm            # pnpm workspace (root lockfile)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/worker
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /apps/openface3-worker
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /apps/pyfeat-worker
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
