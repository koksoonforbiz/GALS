name: CI

on:
  push:
    branches: [main, 'milestone-*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & Typecheck ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ─── API Integration Tests ────────────────────────────────────────
  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ats_user
          POSTGRES_PASSWORD: ats_password
          POSTGRES_DB: ats_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ats_user -d ats_db_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd="mc ready local || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ats_user:ats_password@localhost:5432/ats_db_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-sixteen-characters
      BLOB_STORAGE_ENDPOINT: http://localhost:9000
      BLOB_STORAGE_BUCKET: ats-blobs-test
      BLOB_STORAGE_ACCESS_KEY: minioadmin
      BLOB_STORAGE_SECRET_KEY: minioadmin
      BLOB_STORAGE_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client & run migrations
        run: |
          pnpm --filter @ats/api prisma:generate
          pnpm --filter @ats/api prisma:migrate:deploy

      - name: Run API tests
        run: pnpm --filter @ats/api test

  # ─── E2E Tests (Playwright) ───────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start full stack via Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          # Wait up to 120s for API health
          timeout 120 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null 2>&1; do sleep 3; echo "Waiting for API..."; done'
          echo "API is healthy"
          # Wait up to 60s for Web
          timeout 60 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 3; echo "Waiting for Web..."; done'
          echo "Web is healthy"

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  # ─── Build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  # ─── Two-Door builds + checks ─────────────────────────────────────
  # docs/two-door/ Phase 5. Builds both door bundles, then:
  #   * check-student-bundle: the public bundle carries no private-door
  #     strings (teacher routes, admin-only pages, private API prefixes)
  #   * check-route-coverage: nginx's public allowlist and the API's
  #     DoorGuard agree on every controller route (derived from source)
  # The import boundary itself (dependency-cruiser) runs in lint-typecheck
  # via apps/web's `lint:boundaries`, which `pnpm lint` chains into.
  build-two-door:
    name: Two-Door Builds & Checks
    runs-on: ubuntu-latest
    needs: [lint-typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build student bundle
        run: pnpm --filter @ats/web build:student

      - name: Build admin bundle
        run: pnpm --filter @ats/web build:admin

      - name: Student bundle must not contain private-door strings
        run: node scripts/two-door/check-student-bundle.mjs

      - name: nginx allowlist and DoorGuard must agree on every route
        run: node scripts/two-door/check-route-coverage.mjs

      - name: Render the nginx template (envsubst) and nginx -t it
        # Throwaway self-signed certs so the ssl_certificate directives
        # resolve; nothing here is a real key.
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/gals-certs"
          for door in student admin; do
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$door.gals.test" \
              -keyout "$RUNNER_TEMP/gals-certs/$door.key" -out "$RUNNER_TEMP/gals-certs/$door.crt" 2>/dev/null
          done
          chmod 644 "$RUNNER_TEMP"/gals-certs/*
          # --add-host: `upstream { server api:3000; }` is resolved at config
          # parse time, so the compose service names must resolve to something.
          docker run --rm \
            --add-host api:127.0.0.1 --add-host minio:127.0.0.1 \
            -e NGINX_ENVSUBST_FILTER=^GALS_ \
            -e GALS_STUDENT_HOST=student.gals.test -e GALS_ADMIN_HOST=admin.gals.test \
            -e GALS_STUDENT_PORT=8443 -e GALS_ADMIN_PORT=9443 -e GALS_HTTP_PORT=8080 \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/gals/snippets:ro" \
            -v "$PWD/deploy/nginx/admin-access.local.conf:/etc/nginx/gals/admin-access.conf:ro" \
            -v "$RUNNER_TEMP/gals-certs:/etc/nginx/certs:ro" \
            --entrypoint sh nginxinc/nginx-unprivileged:1.30-alpine -c \
            'rm -f /etc/nginx/conf.d/default.conf && /docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
