# Method-limited variant of proxy-api.conf: only GET (plus HEAD for GET)
# reaches the API; anything else is a 404, indistinguishable from an
# unknown route. Used where a public path pattern also has private
# methods (docs/two-door/api-classification.md, the ⓜ rows).
if ($request_method !~ ^(GET|HEAD)$) { return 404; }
include /etc/nginx/gals/snippets/proxy-api.conf;
