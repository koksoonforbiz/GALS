# TLS settings shared by both doors. Certificates are mounted at
# /etc/nginx/certs/{student,admin}.{crt,key} — mkcert locally
# (deploy/scripts/mkcert-local.sh), Let's Encrypt on the L40 host.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:GALS_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
