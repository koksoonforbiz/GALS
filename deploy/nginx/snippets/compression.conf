# Compress static text assets (2026-11-24: the student bundles, webgazer.js
# and the MediaPipe/pyodide wasm went out uncompressed, ~18 MB per course
# load over a student's connection). API JSON is deliberately NOT listed:
# compressing HTTPS responses that mix secrets (tokens) with user-controlled
# text enables BREACH-style attacks.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml text/plain;
