# Presigned MinIO URLs. The API returns them as RELATIVE `/s3/<bucket>/<key>?X-Amz-...`
# paths signed against BLOB_STORAGE_ENDPOINT (http://minio:9000), so:
#   1. strip the /s3 prefix,
#   2. forward Host as exactly `minio:9000` — NOT $host — or the SigV4
#      signature fails with 403 SignatureDoesNotMatch,
#   3. pass the URI byte-for-byte: $request_uri is the raw request line,
#      so percent-encoding in object keys survives (a `proxy_pass` with a
#      URI part would re-normalise it and break the signature).
# See docs/two-door/config-inventory.md.
location /s3/ {
    set $s3_uri $request_uri;
    if ($request_uri ~ "^/s3(/.*)$") {
        set $s3_uri $1;
    }
    proxy_pass http://gals_minio$s3_uri;
    proxy_http_version 1.1;
    proxy_set_header Host "minio:9000";
    proxy_set_header Connection "";
    # Never forward the browser's cookies/auth to the object store.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    # Uploads (recording segments, PDFs) stream straight through.
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
