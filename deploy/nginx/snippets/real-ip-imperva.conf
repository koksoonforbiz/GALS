# Public door behind Imperva (gals.foodai.org: CNAME → *.impervadns.net,
# origin 223.25.86.58:443 NAT → lithium). Every request then arrives from
# an Imperva edge address, and the API's throttling and login lockout key
# on the client IP — without this, one student's failed logins would lock
# out the whole class.
#
# Trust X-Forwarded-For only when the connection comes from an Imperva
# edge; $remote_addr becomes the visitor, and proxy-api.conf's
# $proxy_add_x_forwarded_for ends in that address, which is where Express
# (`trust proxy` = private hops only) reads req.ip from. A visitor's own
# forged X-Forwarded-For entries sit left of Imperva's and are ignored.
#
# Without Imperva in front (local stack) no connection matches, so this is
# inert. Ranges from https://my.imperva.com/api/integration/v1/ips
# (resp_format=text), fetched 2026-11-13 — re-check when they change.
set_real_ip_from 199.83.128.0/21;
set_real_ip_from 198.143.32.0/19;
set_real_ip_from 149.126.72.0/21;
set_real_ip_from 103.28.248.0/22;
set_real_ip_from 185.11.124.0/22;
set_real_ip_from 192.230.64.0/18;
set_real_ip_from 45.64.64.0/22;
set_real_ip_from 107.154.0.0/16;
set_real_ip_from 45.60.0.0/16;
set_real_ip_from 45.223.0.0/16;
set_real_ip_from 131.125.128.0/17;
set_real_ip_from 2a02:e980::/29;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
