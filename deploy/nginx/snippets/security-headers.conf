# Response headers for both doors. Included at server level AND again in
# any location that has its own add_header (nginx's add_header is not
# inherited once a location adds one of its own).
#
# No Content-Security-Policy yet: the student surface runs pyodide,
# webgazer and mediapipe (wasm, workers, blob: URLs) and helmet on the API
# also has CSP disabled for the same reason. Adding one blind would break
# the sensing stack — leave it for a dedicated pass with the browser open.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
