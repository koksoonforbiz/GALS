# Static SPA serving for one door. `root` is set by the including server
# block (student or admin bundle). Hashed assets are immutable; the HTML
# shell is never cached so a redeploy is picked up on the next load.
index index.html;

location = /index.html {
    include /etc/nginx/gals/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location /assets/ {
    include /etc/nginx/gals/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Everything else is the SPA shell (client-side routing). Anything under
# /api, /socket.io or /s3 never reaches here — those locations are
# defined first and win by prefix.
location / {
    try_files $uri $uri/ /index.html;
}
