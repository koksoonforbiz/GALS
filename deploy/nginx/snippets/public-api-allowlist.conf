# ============================================================================
# PUBLIC (student) door — /api allowlist. DEFAULT DENY.
#
# Generated from docs/two-door/api-classification.md (PUBLIC + BOTH rows,
# 135 routes). Every /api path not listed here returns 404 on the public
# door; the admin door (gals.conf.template, `private` server) proxies all
# of /api. The API additionally enforces the door itself via the
# X-GALS-Door header (Phase 4 door-guard), so this list is the outer of
# two layers, not the only one.
#
# nginx matching rules this file relies on:
#   `= path`      exact match, wins over everything
#   `^~ prefix`   longest prefix wins AND regexes are skipped
#   `~ regex`     checked in file order after prefix matching; first hit wins
#   `prefix`      longest prefix, but only if no regex matches
# So: exact/^~ DENIES first, then regex DENIES, then allows.
#
# Method limits use the proxy-api-<methods>.conf snippets (404, not 403,
# on the wrong method — indistinguishable from an unknown route).
# ============================================================================

# ---- default deny ----------------------------------------------------------
location /api/ {
    return 404;
}

# ---- explicit denies inside otherwise-public prefixes ----------------------
# Self-registration is a staff workflow (students are provisioned by a
# teacher); the student bundle has no /register page either.
location = /api/auth/register                         { return 404; }
# GET /api/attempts and /api/attempts/review are teacher review reads
# (POST /api/attempts is allowed below, in the attempts section).
location = /api/attempts/review                       { return 404; }
# Teacher-only sub-prefixes.
location ^~ /api/activity-log/teacher/                { return 404; }
location ^~ /api/learning-interventions/prompt-config/ { return 404; }
# GET /api/dialogue/courses/:courseId/activity is a teacher dashboard read.
location ~ ^/api/dialogue/courses/[^/]+/activity$     { return 404; }

# ---- auth (pre-auth + self-service; all BOTH except register above) --------
location ^~ /api/auth/ {
    include /etc/nginx/gals/snippets/proxy-api.conf;
}

# ---- courses / topics / assessments: read-only on the public door ----------
# The single-segment regexes cover /catalog, /available and /:id; every
# sub-resource (/modules, /publish, /dialogue-settings, /questions, ...)
# falls through to the default deny.
location ~ ^/api/courses(/[^/]+)?$                     { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location ~ ^/api/topics(/[^/]+)?$                      { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location ~ ^/api/assessments(/[^/]+)?$                 { include /etc/nginx/gals/snippets/proxy-api-get.conf; }

# ---- attempts (student create/list/read/save/submit) -----------------------
location = /api/attempts                               { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location = /api/attempts/my                            { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location ~ ^/api/attempts/[^/]+$                       { include /etc/nginx/gals/snippets/proxy-api-get-patch.conf; }
location ~ ^/api/attempts/[^/]+/submit$                { include /etc/nginx/gals/snippets/proxy-api-post.conf; }

# ---- enrollments (self-service only; teacher enrol/list/drop-student denied) -
location = /api/enrollments/self                       { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location = /api/enrollments/my                         { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location ~ ^/api/enrollments/[^/]+/drop$               { include /etc/nginx/gals/snippets/proxy-api-post.conf; }

# ---- course material: the PDF download URL only ----------------------------
location ~ ^/api/items/[^/]+/download-url$             { include /etc/nginx/gals/snippets/proxy-api-get.conf; }

# ---- blobs (attempt artefacts; all BOTH) -----------------------------------
location ^~ /api/blobs/ {
    include /etc/nginx/gals/snippets/proxy-api.conf;
}

# ---- sensing: recording / gaze / pupil / pyfeat ----------------------------
location ~ ^/api/recording/config/[^/]+$               { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location ~ ^/api/recording/consent/[^/]+$              { include /etc/nginx/gals/snippets/proxy-api-get-post.conf; }
location = /api/recording/segments/initiate            { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location ~ ^/api/recording/segments/[^/]+/(complete|fail)$ { include /etc/nginx/gals/snippets/proxy-api-patch.conf; }
location ~ ^/api/webgazer/config/[^/]+$                { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location = /api/webgazer/logs                          { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location = /api/webgazer/calibration                   { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location ~ ^/api/pupil-size/config/[^/]+$              { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location = /api/pupil-size/logs                        { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location ~ ^/api/pyfeat/config/[^/]+$                  { include /etc/nginx/gals/snippets/proxy-api-get.conf; }

# ---- activity log (session lifecycle + batch ingest) -----------------------
location = /api/activity-log/session/open              { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location = /api/activity-log/session/close             { include /etc/nginx/gals/snippets/proxy-api-post.conf; }
location = /api/activity-log/session/course            { include /etc/nginx/gals/snippets/proxy-api-patch.conf; }
location = /api/activity-log/batch                     { include /etc/nginx/gals/snippets/proxy-api-post.conf; }

# ---- sensing ingest (11 POST routes; all BOTH) -----------------------------
location ^~ /api/logs/ {
    include /etc/nginx/gals/snippets/proxy-api.conf;
}

# ---- student-facing modules (whole prefixes) -------------------------------
# Plain prefix (not ^~) for /api/dialogue/ so the activity deny regex above
# still applies; the others have no private routes, so ^~ is fine.
location /api/dialogue/ {
    include /etc/nginx/gals/snippets/proxy-api.conf;
}
location ^~ /api/dialogue-notes/                       { include /etc/nginx/gals/snippets/proxy-api.conf; }
location ^~ /api/chat-history/                         { include /etc/nginx/gals/snippets/proxy-api.conf; }
location ^~ /api/code-decomposition/                   { include /etc/nginx/gals/snippets/proxy-api.conf; }
location ^~ /api/student-rag/                          { include /etc/nginx/gals/snippets/proxy-api.conf; }
# Plain prefix so the ^~ prompt-config deny (longer prefix) wins.
location /api/learning-interventions/ {
    include /etc/nginx/gals/snippets/proxy-api.conf;
}

# ---- pre-generation / VLM: the two student reads + describe-page -----------
location = /api/pre-generation/match-document          { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location = /api/pre-generation/ready                   { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location ~ ^/api/vlm/config/course/[^/]+$              { include /etc/nginx/gals/snippets/proxy-api-get.conf; }
location = /api/vlm/describe-page                      { include /etc/nginx/gals/snippets/proxy-api-post.conf; }

# Denied by the default rule (listed so a reviewer can see it was deliberate):
#   /api/user-management/**  /api/question-generation/**  /api/questions/**
#   /api/rag/**  /api/llm/**  /api/llm-settings  /api/analytics/**
#   /api/affective-mapping/**  /api/text-mining/**  /api/replay-annotations/**
#   /api/jobs/**  /api/openface3/**  /api/evaluation/**  /api/course-structure/**
#   /api/page-content/**  /api/admin/**  /api/dev/**  /api/health
#   and every teacher-only method on the mixed prefixes above.
