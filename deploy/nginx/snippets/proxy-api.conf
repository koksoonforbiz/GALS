# Common proxy settings for /api/* on both doors.
#
# `$gals_door` is set per `server` block (public | private) and travels
# to the API as X-GALS-Door. proxy_set_header REPLACES any client-supplied
# value, so a caller can never spoof the door from outside.
#
# `gals_api` is the upstream declared in gals.conf.template (compose
# service api:3000, not a real hostname).
proxy_pass http://gals_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-GALS-Door $gals_door;
proxy_set_header Connection "";
proxy_read_timeout 300s;
# express.json() is capped at 12mb in apps/api/src/main.ts; leave headroom
# for the gzip'd replay-snapshot batches.
client_max_body_size 16m;
