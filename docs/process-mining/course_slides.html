<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Prompt Engineering and AI Collaboration — Study Edition</title>
<style>
  :root{
    --paper:#F5F6F8; --ink:#1B2431; --ink-2:#4A5563; --rule:#D9DEE5;
    --blue:#2C5A8A; --blue-bg:#EEF3F9; --moss:#3F7A57; --moss-bg:#EDF4EF;
    --amber:#B0741E; --amber-bg:#FBF3E4; --plum:#6B4C8A; --plum-bg:#F2EDF7;
    --red:#A63D3D; --red-bg:#FBEDED; --slate:#5B6672; --slate-bg:#F0F2F4;
    --serif:"Charter","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --rail:280px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55}
  a{color:var(--blue)} button{font-family:var(--sans)}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}
  .rail{border-right:1px solid var(--rule);background:#fff;display:flex;flex-direction:column;min-height:0}
  .rail-head{padding:22px 22px 14px;border-bottom:1px solid var(--rule)}
  .rail-head h1{font-family:var(--sans);font-size:15px;font-weight:600;margin:0 0 4px}
  .rail-head p{margin:0;font-size:13px;color:var(--ink-2);font-family:var(--sans)}
  .rail nav{overflow:auto;flex:1;padding:8px 0}
  .rail nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 22px;font-size:14px;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
  .rail nav button:hover{background:var(--slate-bg)}
  .rail nav button.active{border-left-color:var(--blue);background:var(--blue-bg);font-weight:600}
  .rail nav button span{display:block;font-size:12px;color:var(--ink-2);font-weight:400}
  .rail-foot{padding:14px 22px;border-top:1px solid var(--rule);font-family:var(--sans);font-size:13px;color:var(--ink-2)}
  .rail-foot button{margin-top:8px;width:100%;padding:8px;border:1px solid var(--rule);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
  .rail-foot button:hover{background:var(--slate-bg)}
  .stage{position:relative;min-height:0;min-width:0}
  .deck{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}}
  .slide{min-height:100vh;scroll-snap-align:start;padding:56px 8vw 96px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--rule)}
  .slide-inner{max-width:72ch;width:100%;min-width:0;overflow-wrap:anywhere}
  .slide-label{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .slide-label b{font-weight:600;color:var(--ink)}
  .slide-label .num{border:1px solid var(--rule);border-radius:20px;padding:1px 9px;background:#fff}
  h2{font-size:32px;line-height:1.15;margin:0 0 18px;font-weight:600;letter-spacing:-.01em}
  h4{font-family:var(--sans);font-size:15px;margin:20px 0 6px;font-weight:600}
  p{margin:0 0 13px} ul,ol{margin:0 0 13px;padding-left:1.3em} li{margin-bottom:6px} li>ul,li>ol{margin-top:6px}
  code,pre{font-family:var(--mono);font-size:14px}
  code{background:var(--slate-bg);padding:1px 5px;border-radius:4px}
  pre{background:#F7F8FA;border:1px solid var(--rule);border-radius:8px;padding:14px 16px;overflow:auto;white-space:pre-wrap;line-height:1.45;margin:0 0 13px}
  pre code{background:none;padding:0}
  table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:15px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
  th{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--ink-2)}
  .sec-title .slide-inner{max-width:80ch}
  .sec-title h2{font-size:46px;margin-bottom:10px}
  .sec-title .covers{font-family:var(--sans);color:var(--ink-2);font-size:15px;margin-bottom:24px}
  .sec-title .big-q{font-size:20px;line-height:1.4;margin:0 0 28px;padding-left:16px;border-left:3px solid var(--amber)}
  .sec-title .rhythm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-family:var(--sans);font-size:13px}
  .sec-title .rhythm div{border-top:2px solid var(--ink);padding-top:8px}
  .sec-title .rhythm b{display:block;font-size:14px;margin-bottom:2px}
  .sec-title .rhythm i{color:var(--ink-2);font-style:normal}
  .box{border-left:4px solid var(--slate);background:var(--slate-bg);border-radius:0 8px 8px 0;padding:18px 22px;margin:0 0 16px}
  .box .box-title{font-family:var(--sans);font-size:13px;font-weight:600;margin:0 0 10px;color:var(--slate)}
  .box>*:last-child{margin-bottom:0}
  .box.think{border-color:var(--amber);background:var(--amber-bg)} .box.think .box-title{color:var(--amber)}
  .box.task{border-color:var(--blue);background:var(--blue-bg)} .box.task .box-title{color:var(--blue)}
  .box.ai{border-color:var(--moss);background:var(--moss-bg)} .box.ai .box-title{color:var(--moss)}
  .box.example{border-color:var(--plum);background:var(--plum-bg)} .box.example .box-title{color:var(--plum)}
  .box.stretch{border-color:var(--red);background:var(--red-bg)} .box.stretch .box-title{color:var(--red)}
  .box.concept{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--ink)} .box.concept .box-title{color:var(--ink)}
  .box.check,.box.predict{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--amber)} .box.check .box-title,.box.predict .box-title{color:var(--amber)}
  textarea{width:100%;min-height:110px;font-family:var(--serif);font-size:16px;line-height:1.5;padding:12px;border:1px solid var(--rule);border-radius:8px;background:#fff;resize:vertical}
  .actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;font-family:var(--sans);font-size:14px}
  .btn{padding:9px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-size:14px}
  .btn.secondary{background:#fff;color:var(--ink)} .btn.secondary:hover{background:var(--slate-bg)}
  .status{color:var(--ink-2)} .status.ok{color:var(--moss)}
  .locked-note{font-family:var(--sans);font-size:13px;color:var(--amber);margin-top:8px}
  .reveal{display:none;margin-top:14px;padding:14px 16px;background:var(--slate-bg);border-radius:8px;font-size:15.5px}
  .reveal.open{display:block} .reveal>*:last-child{margin-bottom:0}
  .qa{margin:0 0 12px;padding:0 0 12px;border-bottom:1px dashed var(--rule)} .qa:last-of-type{border-bottom:0}
  .qa .q{margin-bottom:6px} .qa .a{display:none;background:var(--slate-bg);padding:10px 12px;border-radius:6px;font-size:15px} .qa.open .a{display:block}
  .qa button{font-family:var(--sans);font-size:13px;padding:4px 10px;border-radius:4px;border:1px solid var(--rule);background:#fff;cursor:pointer}
  .qa button:hover{background:var(--slate-bg)}
  .mcq .opt{display:block;width:100%;text-align:left;font-family:var(--serif);font-size:16px;padding:10px 14px;margin:0 0 8px;border:1px solid var(--rule);border-radius:8px;background:#fff;cursor:pointer}
  .mcq .opt:hover{background:var(--slate-bg)}
  .mcq .opt.right{border-color:var(--moss);background:var(--moss-bg)} .mcq .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .mcq .fb{display:none;margin-top:8px;padding:12px 14px;border-radius:8px;background:var(--slate-bg);font-size:15.5px} .mcq .fb.show{display:block}
  .misc .item{border:1px solid var(--rule);border-radius:8px;padding:12px 16px;margin-bottom:10px;background:#fff;cursor:pointer}
  .misc .item .claim{font-weight:600} .misc .item .claim::before{content:"Claim: ";font-family:var(--sans);font-weight:600;color:var(--red);font-size:13px}
  .misc .item .truth{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)} .misc .item .truth::before{content:"Reality: ";font-family:var(--sans);font-weight:600;color:var(--moss);font-size:13px}
  .misc .item.open .truth{display:block} .misc .hint{font-family:var(--sans);font-size:13px;color:var(--ink-2)}
  .score table td:first-child{width:60%} .score label{margin-right:10px;font-family:var(--sans);font-size:14px} .score .total{font-family:var(--sans);font-weight:600;margin-top:10px}
  .fig{margin:0 0 16px} .fig-svg{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:12px} .fig-svg svg{width:100%;height:auto;display:block}
  figcaption{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);margin:10px 4px 0;line-height:1.45}
  .fig-notice{margin-top:12px;padding:12px 16px;background:var(--slate-bg);border-radius:8px;font-size:15px} .fig-notice b{font-family:var(--sans);font-size:13px} .fig-notice ul{margin:6px 0 0}
  .slide.fig-slide .slide-inner{max-width:86ch}
  .lab-tag{color:var(--plum);font-weight:600} .materials{font-family:var(--sans);font-size:13px;color:var(--ink-2);border-top:1px dashed var(--rule);padding-top:8px;margin-top:10px}
  textarea.mini{min-height:64px;font-size:15px;margin-top:6px} textarea.short{min-height:44px}
  .qa .show{font-family:var(--sans);font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--rule);background:#fff;cursor:pointer} .qa .show:disabled{opacity:.45;cursor:not-allowed}
  .qa .after,.misc .after{margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);font-family:var(--sans);font-size:13px} .qa .after label,.misc .after label{display:block;margin-bottom:4px;color:var(--ink-2)}
  .misc .commit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-family:var(--sans)} .misc .commit input{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;font-family:var(--serif);font-size:15px}
  .misc .commit button,.misc .after button{font-family:var(--sans);font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--rule);background:#fff;cursor:pointer} .misc button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .misc .item{cursor:default} .mcq .opt:disabled{opacity:.5;cursor:not-allowed} .res-label{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-top:12px}
  .core{margin-top:22px;font-family:var(--sans);font-size:13px;border-top:1px solid var(--rule);padding-top:12px} .core b{display:block;margin-bottom:4px} .core ol{margin:0 0 6px;padding-left:1.4em} .core li{margin-bottom:2px} .core span{color:var(--ink-2)}
  .fig-alt{font-family:var(--sans);font-size:13px;margin-top:8px;color:var(--ink-2)} .fig-alt summary{cursor:pointer} .fig-alt p{margin:6px 0 0;font-family:var(--serif);font-size:14.5px;color:var(--ink)}
  .progress{position:fixed;top:0;left:var(--rail);right:0;height:4px;background:var(--rule);z-index:5}
  .progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
  .nav{position:fixed;right:24px;bottom:24px;display:flex;gap:8px;z-index:5}
  .nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:#fff;cursor:pointer;font-size:18px;box-shadow:0 1px 2px rgba(27,36,49,.08)}
  .nav button:hover{background:var(--slate-bg)}
  .counter{position:fixed;left:calc(var(--rail) + 24px);bottom:30px;font-family:var(--sans);font-size:13px;color:var(--ink-2);z-index:5}
  .menu-btn{display:none}
  @media (max-width:900px){
    :root{--rail:0px} .app{grid-template-columns:1fr}
    .rail{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;max-width:320px}
    .rail.open{transform:none;box-shadow:0 0 0 100vw rgba(27,36,49,.35)}
    .menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:6;padding:8px 12px;border-radius:6px;border:1px solid var(--rule);background:#fff;font-size:14px;cursor:pointer}
    .slide{padding:64px 6vw 96px} h2{font-size:26px} .sec-title h2{font-size:32px}
    .sec-title .rhythm{grid-template-columns:1fr 1fr} .counter{left:16px;bottom:34px} .progress{left:0}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-head"><h1>Advanced Prompt Engineering and AI Collaboration</h1><p>Study edition · 8 sessions · 60-min core path + labs</p></div>
    <nav id="sessionNav" aria-label="Sessions"></nav>
    <div class="rail-foot"><div id="doneCount"></div>
      <button id="dlLog">Download activity log (JSON)</button>
      <button id="resetLog">Clear my answers</button></div>
  </aside>
  <main class="stage">
    <div class="progress"><i id="progressBar"></i></div>
    <button class="menu-btn" id="menuBtn">Sessions</button>
    <div class="deck" id="deck" tabindex="0"></div>
    <div class="counter" id="counter"></div>
    <div class="nav"><button id="prevBtn" aria-label="Previous slide">↑</button><button id="nextBtn" aria-label="Next slide">↓</button></div>
  </main>
</div>
<script>
const COURSE=[{"id": 1, "title": "How Language Models See Text", "covers": "Week 1: how LLMs predict text, tokens, context windows.", "bigq": "If a model can write a sonnet, why can it not reliably count the letters in a word?", "slides": [{"t": "objectives", "items": ["Explain generation as repeated next-token sampling, and derive three practical consequences for prompting.", "Describe how byte-pair encoding builds a vocabulary, and predict which kinds of text are token-expensive and why.", "Explain what competes for space in a context window, why attention cost grows with length, and how position affects recall.", "Design a small experiment that tests a claim about model behaviour rather than assuming it."]}, {"t": "theory", "heading": "Before you begin: how to use this course safely and well", "html": "\n   <p><strong>Who this is for.</strong> Working professionals who have used an AI assistant and want to understand and control what it does. No machine-learning background is assumed. Where a technical term is unavoidable (probability distribution, embedding, schema) it is defined when first used and collected in the glossary at the end.</p>\n   <p><strong>How each session works.</strong> A session is designed to fit 55–60 minutes on the <em>core path</em>: one gated prediction, the theory with embedded checks, one or two core experiments, and a reflection. Activities marked <em>Lab · take-home</em> and <em>Stretch</em> are optional and sit outside that hour; they are where the full-size replications live.</p>\n   <p><strong>Three standing rules.</strong></p>\n   <ol><li><strong>Record the model you used.</strong> Many results in this course are model- and version-dependent. Every experiment asks you to note the model name, version or date, the sampling settings (temperature etc.), and whether tools or browsing were switched off. A result without that record cannot be compared with anyone else’s.</li>\n   <li><strong>Use only the fictional materials provided.</strong> Do not paste confidential, customer or personal data into any AI system during this course unless your organisation has explicitly approved that provider and its data-handling settings (retention, training use, residency). The course pack supplies fictional documents for every activity. In your own work, apply a short checklist before any model sees data: Is this data class approved for this provider? Does the provider retain it or train on it? Where is it processed? When is it deleted? Who reviews the output before it is acted on?</li>\n   <li><strong>Security exercises run in the course sandbox only.</strong> Session 8’s red-team work targets a fictional assistant with a harmless test library. Never test attacks against real services, accounts or data.</li></ol>\n   <p><strong>How to read claims here.</strong> Three kinds of statement appear and are labelled where it matters: <em>mechanism</em> (how the system works, stated as a simplified model), <em>historical result</em> (what a named paper measured on the models of its time), and <em>heuristic to test</em> (a useful default that you should verify on your own model). Expected-result panels in experiments do not predict an outcome; they give you an analysis template to apply after you have your own numbers.</p>\n   <p><strong>Scope.</strong> The course covers prompting, in-context examples, reasoning, system design, evaluation, grounding and tools, security, and a single unit on composing these into multi-step agents (7.7). Production agent architecture is out of scope.</p><p><em>Content verified 6 October 2026. Sections on reasoning models, long context, security and image generation decay quickly and are reviewed quarterly; see References for the review list.</em></p>"}, {"t": "think", "box": "Opening prediction 1", "prompt": "<p>Rank these strings from <em>fewest</em> to <em>most</em> tokens for an English-trained tokenizer, then give a rough count for each (e.g. “about 6”).</p>\n   <ol type=\"a\"><li><code>The cat sat on the mat.</code></li><li><code>Le chat s'est assis sur le tapis.</code></li><li><code>{\"user_id\": 48213, \"ok\": true}</code></li><li><code>Antidisestablishmentarianism</code></li><li><code>2024-09-17T08:30:00Z</code></li></ol>\n   <p>Then: a model writes flawless sonnets but miscounts the letter <em>r</em> in <em>strawberry</em>. Propose a mechanism that explains both facts at once.</p>"}, {"t": "theory", "heading": "1.1 Generation is sampling, one token at a time", "html": "\n   <p>A language model is a function from a sequence of tokens to a probability distribution over the next token. Generation is a loop: sample from that distribution, append the chosen token, run the function again. This is <em>autoregressive decoding</em>. The transformer (Vaswani et al., 2017) computes each prediction with <em>self-attention</em>: every position builds a weighted summary of every earlier position, so the next-token distribution can depend on anything in the context, from the first word of the system prompt to the last word you typed.</p>\n   <p>Two settings control the loop. <strong>Temperature</strong> divides the model’s raw scores before they are turned into probabilities: near 0 decoding becomes greedy—in many APIs temperature 0 selects the highest-scoring continuation, though hosted inference is not guaranteed to be bit-for-bit deterministic; at 1 the model samples from its “honest” distribution; above 1 rare tokens are boosted. <strong>Top-p (nucleus) sampling</strong> truncates the distribution to the smallest set of tokens whose probabilities sum to <em>p</em>, then samples within it (Holtzman et al., 2020). Holtzman et al. showed why pure greedy decoding is often bad: the most probable continuation of human text is frequently bland and repetitive, because humans do not write the single most likely next word.</p>\n   <p>Three consequences for prompting:</p>\n   <ol>\n   <li><strong>Everything in the window can influence the output.</strong> A typo in an example, a sarcastic aside, or a hostile sentence inside a pasted document all move the distribution. Chat systems do mark message roles, and models are trained to give higher-authority messages more weight (Session 5)—but that weighting is learned and probabilistic, so lower-authority text is <em>influential</em> even when it is not <em>authoritative</em>. Few-shot examples (S3), delimiters (S5) and prompt injection (S8) all follow from this.</li>\n   <li><strong>One decoding step, one token.</strong> The amount of work in a step is not a constant—it depends on context length, architecture, caching and, for some current services, hidden reasoning performed before the visible answer—but a useful simplified model is that a single step has limited capacity. For some models and tasks, writing intermediate results out as tokens measurably improves accuracy (S4). Treat that as an empirical prompting effect to test, not as proof that visible tokens are the only computation available.</li>\n   <li><strong>An answer is a draw, not a lookup.</strong> (This is the mechanism-level view; it is a simplified model of a stateless call, and Session 1.5 says what it leaves out.) The same prompt can yield different answers at non-zero temperature; even at temperature 0, small wording changes move the argmax. Any claim about “what the model does” is a claim about a distribution and needs more than one sample to support it (S6).</li>\n   </ol>"}, {"t": "figure", "caption": "Figure 1.1 — The autoregressive loop. One forward pass yields a distribution over the next token; one token is sampled, appended, and the pass repeats. Everything in the window shapes every prediction.", "notice": ["There is no separate ‘question’ input: the prompt and the model’s own earlier output are one sequence.", "Temperature and top-p act only at the sampling step—they never change the scores the model computed.", "Each decoding step produces one token, but its compute and latency depend on context length, architecture, caching and—on some services—hidden reasoning. The useful simplification: a hard visible step does not automatically get extra visible steps unless the model or system allocates them."], "svg": "<svg viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#4A5563\"/></marker></defs>\n <rect x=\"20\" y=\"90\" width=\"230\" height=\"70\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"135\" y=\"115\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Context window (tokens)</text>\n <text x=\"135\" y=\"140\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">The capital of Australia is</text>\n <path d=\"M250,125 L300,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/>\n <rect x=\"300\" y=\"75\" width=\"130\" height=\"100\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"365\" y=\"105\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Transformer</text><text x=\"365\" y=\"125\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">self-attention</text><text x=\"365\" y=\"145\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">one forward pass</text>\n <path d=\"M430,125 L480,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/>\n <rect x=\"480\" y=\"55\" width=\"220\" height=\"140\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"590\" y=\"78\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Next-token distribution</text>\n <rect x=\"500\" y=\"90\" width=\"120\" height=\"14\" fill=\"#2C5A8A\"/><text x=\"625\" y=\"101\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">Canberra .81</text>\n <rect x=\"500\" y=\"112\" width=\"18\" height=\"14\" fill=\"#2C5A8A\" opacity=\".55\"/><text x=\"625\" y=\"123\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">Sydney .09</text>\n <rect x=\"500\" y=\"134\" width=\"10\" height=\"14\" fill=\"#2C5A8A\" opacity=\".4\"/><text x=\"625\" y=\"145\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">located .04</text>\n <rect x=\"500\" y=\"156\" width=\"5\" height=\"14\" fill=\"#2C5A8A\" opacity=\".3\"/><text x=\"625\" y=\"167\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">…</text>\n <path d=\"M590,195 L590,225 L135,225 L135,163\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/>\n <text x=\"360\" y=\"243\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">sample one token → append → repeat</text>\n </svg>", "alt": "A left-to-right loop. A box labelled “Context window (tokens)” containing the text “The capital of Australia is” feeds a box labelled “Transformer: self-attention, one forward pass”, which feeds a box “Next-token distribution” showing a bar chart: Canberra .81 (long bar), Sydney .09, located .04, then smaller entries. An arrow returns from the distribution to the context window labelled “sample one token → append → repeat”."}, {"t": "predict", "box": "Checkpoint 1", "prompt": "<p>Two prompts. A: <code>The capital of Australia is</code>. B: <code>Many people wrongly believe that the capital of Australia is</code>. Write down the most probable next word for each, and one sentence on <em>why</em> B differs, if it does.</p>", "reveal": "<p>A likely continuation for A is <code>Canberra</code>. For B, <code>Sydney</code> is a plausible completion because the framing asks for a common misconception—but a current instruction-tuned assistant may instead answer meta-linguistically (“People often say Sydney, but the capital is Canberra”) or continue differently. The exact continuation is model- and decoding-dependent, so record the model and sample several runs before generalising. What the exercise shows either way: the model completes the context it is given, and leading framing changes what counts as a plausible completion. Subtler cues—an example set where every answer is “(A)”, a document whose tone implies a conclusion—act the same way.</p>"}, {"t": "theory", "heading": "1.2 Tokens: how text becomes numbers", "html": "\n   <p>Models do not read characters. A <em>subword tokenizer</em> maps text to integers from a fixed vocabulary. Most modern LLM tokenizers belong to one family: <strong>byte-pair encoding</strong> (Sennrich et al., 2016, originally for machine translation) and its byte-level variants. The core procedure: start from a base alphabet—individual characters in the original formulation, the 256 byte values in byte-level BPE as used by GPT-style tokenizers—then repeatedly find the most frequent adjacent pair in a training corpus and merge it into a new symbol, until the vocabulary reaches a target size (tens of thousands to ~200k for modern models). The result is a compression scheme tuned to the training corpus: frequent strings become single tokens, rare strings are assembled from pieces. Other schemes exist (unigram, byte-fallback), but the practical consequences below hold for all of them.</p>\n   <p>Because the merges are learned from corpus statistics, token cost is a proxy for how familiar a string is:</p>\n   <ul>\n   <li>Common English words with a leading space (<code>&nbsp;cat</code>, <code>&nbsp;running</code>) are one token. The same word capitalised, or without the space, may be a different token or several.</li>\n   <li>Rare words split at whatever fragments were frequent elsewhere: <em>antidisestablishmentarianism</em> becomes something like <code>Ant</code>+<code>idis</code>+<code>establishment</code>+<code>arian</code>+<code>ism</code>—morphologically sensible by accident, not design.</li>\n   <li>Languages under-represented in the tokenizer’s training corpus are fragmented more finely, so the same sentence can cost noticeably more tokens; how much more depends on the tokenizer and the language, and recent multilingual tokenizers have narrowed the gap. Measure your production tokenizer on matched sentences rather than assuming a factor. Where the gap is large it is a fairness issue as well as a cost one.</li>\n   <li>Digits are usually tokenised in short groups (often 1–3 digits), so <code>48213</code> is two or three tokens and arithmetic must operate on fragments rather than place values.</li>\n   <li>Code, JSON and markup tokenize differently from prose because punctuation, whitespace and identifiers have different merge statistics. Some punctuation and whitespace sequences are single tokens (a four-space indent, a common brace-newline pattern); others are split. Structured formats can be more or less efficient than prose depending on field names and whitespace—compare representative payloads with the tokenizer you will use.</li>\n   </ul>\n   <p>Some famous failures are related. Counting the <em>r</em>s in <em>strawberry</em> is a letter-level task, but the model’s input is chunks such as <code>str</code>+<code>aw</code>+<code>berry</code>; characters do not align one-to-one with tokens, so letter-level operations (counting, reversing, spotting doubled letters) can be brittle. Tokenization is one contributor, not the whole story—models retain some character information, and current models and tools handle these tasks with varying success. Two practical responses: reshape the input so the units the task needs are visible (spelling the word with spaces often makes the characters easier for the tokenizer and model to isolate—verify the actual segmentation with your tokenizer), or hand exact counting to a deterministic tool. Lab 1B tests the first on your model.</p>"}, {"t": "figure", "caption": "Figure 1.2 — Byte-pair encoding in miniature. Starting from single characters, the most frequent adjacent pair is merged into a new symbol; repeated over a large corpus this yields a vocabulary where common words are one token and rare strings are assembled from pieces.", "notice": ["Merges follow corpus frequency, not linguistics; the resulting pieces are sometimes morphemes by accident.", "Token count reflects how compactly the tokenizer’s learned vocabulary represents the string; corpus frequency is one important influence on that vocabulary.", "This is why the same sentence costs different amounts in different languages."], "svg": "<svg viewBox=\"0 0 720 240\" xmlns=\"http://www.w3.org/2000/svg\">\n <text x=\"20\" y=\"30\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Corpus fragment: “low lower lowest slow”</text>\n <g transform=\"translate(20,50)\"><text x=\"0\" y=\"16\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">step 0</text>\n <rect x=\"60\" y=\"0\" width=\"26\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"73\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">l</text><rect x=\"90\" y=\"0\" width=\"26\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"103\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">o</text><rect x=\"120\" y=\"0\" width=\"26\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"133\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">w</text><rect x=\"150\" y=\"0\" width=\"26\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"163\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">_</text><rect x=\"180\" y=\"0\" width=\"26\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"193\" y=\"1 " style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">_</text><rect x=\"356\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;stroke:#2C5A8A;stroke-width:2\"/><text x=\"372\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">lo</text><rect x=\"393\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"409\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">w</text><rect x=\"430\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"446\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">e</text><rect x=\"467\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"483\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">s</text><rect x=\"504\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"520\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">t</text><rect x=\"541\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"557\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">_</text><rect x=\"578\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"594\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">s</text><rect x=\"615\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;stroke:#2C5A8A;stroke-width:2\"/><text x=\"631\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">lo</text><rect x=\"652\" y=\"0\" width=\"33\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6;\"/><text x=\"668\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">w</text></g>\n <text x=\"80\" y=\"170\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">next: (lo, w) → “low”; then (e, r), (e, s)… until the vocabulary size is reached</text>\n <g transform=\"translate(20,180)\"><text x=\"0\" y=\"16\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">step k</text>\n <rect x=\"60\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"86\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">low</text><rect x=\"118\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"144\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">_</text><rect x=\"176\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"202\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">low</text><rect x=\"234\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"260\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">er</text><rect x=\"292\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"318\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">_</text><rect x=\"350\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"376\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">low</text><rect x=\"408\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"434\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">est</text><rect x=\"466\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"492\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">_</text><rect x=\"524\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"550\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">s</text><rect x=\"582\" y=\"0\" width=\"52\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"608\" y=\"17\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">low</text></g>\n <text x=\"20\" y=\"232\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">“low” is one token; “slow” is two (s + low) because “slow” was rarer than “low” in this corpus.</text>\n </svg>", "alt": "Three rows of boxes showing a corpus fragment “low lower lowest slow”. Step 0 shows every character in its own box. Step 1 merges the most frequent pair (l,o) into “lo” boxes, highlighted. Step k shows “low” as a single box, “er” and “est” as suffix boxes, and “slow” split into “s” + “low”. A note explains that “low” is one token and “slow” is two because “slow” was rarer in this corpus."}, {"t": "mcq", "q": "You observe that a 40-line code sample costs more tokens than a 40-line prose paragraph of similar length on your tokenizer. Which conclusion is justified?", "options": [{"t": "This tokenizer represents this code sample less compactly than the prose.", "ok": true, "fb": "The only safe inference. Punctuation, whitespace and identifiers have different merge statistics from common words, so the ratio varies by text and tokenizer. Measure, do not generalise."}, {"t": "Code always requires more tokens because code is inherently harder to model.", "ok": false, "fb": "Tokenizers have no notion of difficulty, and “always” is not supported by one comparison."}, {"t": "Every punctuation and indentation mark in code must occupy its own token.", "ok": false, "fb": "Some punctuation and whitespace sequences are merged into single tokens; others are split. The statement is too strong."}]}, {"t": "theory", "heading": "1.3 The context window: capacity, cost, and position", "html": "\n   <p>The <strong>context window</strong> is the maximum number of tokens one call can attend over, counting <em>everything</em>: system prompt, conversation history, documents, tool results, your question, and the tokens the model generates in reply. What happens at the limit is application-specific: an API may reject the call, an application may truncate selected content, summarise history, or reserve space for output—so document the policy rather than assuming the oldest turns are silently dropped. Three separate things grow with length and should be kept apart: <em>compute</em> (full self-attention has an O(n²) term when processing a long prompt), <em>billed cost and latency</em> (which depend on the provider’s pricing, caching and architecture—measure the deployed stack), and <em>behavioural accuracy</em>, which is the subject of the next paragraph.</p>\n   <p>Liu et al. (2023) tested this directly. They gave models a question and 10–30 retrieved documents, exactly one of which contained the answer, and moved that document through every position. Accuracy was highest when the answer was first or last and degraded substantially in the middle—in some reported settings by more than 20 percentage points—a U-shaped curve that appeared even in models advertised as handling the full length. The magnitude is model-dependent (historical result, 2023 models; current long-context models vary, and some show much flatter curves), so treat the size of the effect as something to measure. The experiment establishes the behavioural effect; it does not settle its cause.</p>\n   <p>A second property holds for a <em>stateless model call</em>: <strong>the model uses only the state supplied to that call</strong>. Applications add memory outside the immediate prompt—stored conversation state, retrieval, persistent “memory” features, reasoning-state objects—so distinguish <em>model context</em> (what is in this call) from <em>application memory</em> (what the application chooses to put there). When an assistant “forgets” an instruction given twenty turns ago, either the application no longer supplies it, or it is still there but diluted by thousands of later tokens competing for attention.</p>\n   <p>Practical rules that follow: put the most important material first or last; restate the key instruction after a long block of data; prefer several short calls over one enormous one when tasks are independent; and never assume the model “read” something because it was in the window.</p>"}, {"t": "figure", "caption": "Figure 1.3 — What fills the window, and where the model looks. Left: fixed overhead, variable input and reserved output share one budget. Right: a schematic of the “lost in the middle” pattern (shape only, drawn for this course; not reproduced data) after Liu et al. (2023).", "notice": ["Output tokens count against the same limit; an unreserved answer is a truncated answer.", "The curve was U-shaped in the 2023 experiments; its depth is model-dependent and should be measured on your model.", "Restating the question after the data can help on models that show positional or recency sensitivity; measure the effect on your deployed model."], "svg": "<svg viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#4A5563\"/></marker></defs>\n <text x=\"20\" y=\"28\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Context budget (one call)</text>\n <rect x=\"20\" y=\"40\" width=\"300\" height=\"34\" fill=\"#DDE1E6\"/>\n <rect x=\"20\" y=\"40\" width=\"70\" height=\"34\" fill=\"#6B4C8A\" opacity=\".85\"/><text x=\"55\" y=\"61\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:11px;fill:#fff\">system + tools</text>\n <rect x=\"90\" y=\"40\" width=\"50\" height=\"34\" fill=\"#B0741E\" opacity=\".85\"/><text x=\"115\" y=\"61\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:11px;fill:#fff\">examples</text>\n <rect x=\"140\" y=\"40\" width=\"120\" height=\"34\" fill=\"#2C5A8A\" opacity=\".85\"/><text x=\"200\" y=\"61\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:11px;fill:#fff\">documents / history</text>\n <rect x=\"260\" y=\"40\" width=\"60\" height=\"34\" fill=\"#3F7A57\" opacity=\".85\"/><text x=\"290\" y=\"61\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:11px;fill:#fff\">output</text>\n <text x=\"20\" y=\"96\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">fixed overhead, paid every call</text><text x=\"262\" y=\"96\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">must be reserved</text>\n <text x=\"20\" y=\"150\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Position within a long prompt</text>\n <rect x=\"20\" y=\"160\" width=\"300\" height=\"24\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"170\" y=\"177\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">instructions … data … data … data … question</text>\n <path d=\"M60,204 L60,188\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><text x=\"60\" y=\"220\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">best</text>\n <path d=\"M170,204 L170,188\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><text x=\"170\" y=\"220\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">worst</text>\n <path d=\"M290,204 L290,188\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><text x=\"290\" y=\"220\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">best</text>\n <g transform=\"translate(400,30)\">\n <line x1=\"30\" y1=\"180\" x2=\"290\" y2=\"180\" stroke=\"#4A5563\"/><line x1=\"30\" y1=\"180\" x2=\"30\" y2=\"20\" stroke=\"#4A5563\"/>\n <text x=\"160\" y=\"205\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">position of relevant passage</text>\n <text x=\"14\" y=\"100\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\" transform=\"rotate(-90 14 100)\">accuracy</text>\n <path d=\"M40,40 C90,60 120,130 160,130 C200,130 230,60 280,45\" fill=\"none\" stroke=\"#2C5A8A\" stroke-width=\"2.5\"/>\n <text x=\"45\" y=\"32\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">start</text><text x=\"255\" y=\"37\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">end</text><text x=\"145\" y=\"150\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">middle</text>\n <text x=\"160\" y=\"15\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">“Lost in the middle”</text></g>\n </svg>", "alt": "Left: a horizontal bar divided into four coloured segments labelled system + tools, examples, documents / history, and output, with notes “fixed overhead, paid every call” and “must be reserved”. Below it, a prompt bar “instructions … data … data … data … question” with arrows marking the start and end as “best” and the middle as “worst”. Right: a line chart titled “Lost in the middle” with accuracy on the vertical axis and position of the relevant passage on the horizontal axis; the curve is high at the start, dips in the middle, and rises again at the end (schematic shape only)."}, {"t": "example", "box": "Worked example: the same instruction, three positions", "html": "\n   <p>A support-summary prompt contains a 3,000-token ticket followed by <code>Summarise in three bullets. Do not mention customer names.</code> Names keep appearing. Three diagnoses, in order of likelihood:</p>\n   <ol><li><strong>Position.</strong> The rule sits after a long block and is one instruction among thousands of tokens of customer prose. Fix: state the rules before the ticket <em>and</em> repeat the non-negotiable one after it.</li>\n   <li><strong>Specification.</strong> “Do not mention names” says what to avoid but not what to do instead. Fix to test: the affirmative form—“refer to the customer as ‘the customer’”—because it specifies the desired output directly. Do not assume that naming a forbidden concept necessarily makes it more likely; test both forms on your model (Lab 2C).</li>\n   <li><strong>Competing signal.</strong> The ticket itself is full of names in prominent positions (signature, greeting). Fix: pre-process the ticket to redact them, which is more reliable than any wording.</li></ol>\n   <p>Notice that the third fix is not a prompt change at all. A recurring theme of this course: some problems are best solved outside the prompt.</p>"}, {"t": "theory", "heading": "1.4 Budgeting context deliberately", "html": "\n   <p>Treat the context window as a budget with three kinds of spending: <em>fixed overhead</em> (system prompt, tool definitions, few-shot examples—paid on every call), <em>variable input</em> (the document or conversation), and <em>output</em> (which must be reserved, or the answer gets cut off). Two questions decide most designs: what does the model need to <em>see</em> to do this task, and what can it be told <em>about</em> instead of shown?</p>\n   <p>Strategies, roughly in order of preference:</p>\n   <ol>\n   <li><strong>Remove by relevance, not position.</strong> Ask, for each section, whether any plausible question needs it. Boilerplate, legal footers, repeated headers and navigation text go first.</li>\n   <li><strong>Compress the relevant.</strong> Prose to bullet lists; tables instead of narrated numbers; drop examples once the pattern is unambiguous; replace a long definition with the term the model already knows.</li>\n   <li><strong>Structure for navigation.</strong> Headings and tags let the model attend selectively. A wall of text forces it to attend everywhere at once.</li>\n   <li><strong>Summarise the old, keep the recent.</strong> In long conversations, replace turns older than <em>n</em> with a model-written summary and keep the last <em>n</em> verbatim.</li>\n   <li><strong>Retrieve rather than include.</strong> For any corpus larger than the window, fetch the relevant passages at query time (Session 7).</li>\n   </ol>\n   <p>The naive strategy—cut from the end until it fits—is worst, because it discards by position rather than by relevance. The second-worst is cutting from the beginning, which usually removes the instructions.</p>"}, {"t": "theory", "heading": "1.5 Where an assistant comes from: pre-training, instruction tuning, preference tuning", "html": "\n   <p>Everything so far describes a <em>base</em> model: a next-token predictor trained on a large corpus. A base model completes text; asked a question, it may continue with more questions, because that is what often follows a question in web text. Assistants are produced by further post-training. The historically important recipe, documented for InstructGPT by Ouyang et al. (2022), has two stages:</p>\n   <ol><li><strong>Supervised fine-tuning (SFT).</strong> The model is trained on demonstrations of desired behaviour—prompt and ideal response pairs written by people. This teaches the <em>form</em> of assistance: answer the question, follow the instruction, stop.</li>\n   <li><strong>Preference tuning (RLHF and its successors).</strong> People compare pairs of responses; a reward model learns those preferences; the policy is optimised against it. This teaches judgement about which of many acceptable answers is better—more helpful, safer, better formatted.</li></ol>\n   <p>Modern assistants use a wider family of methods—direct preference optimisation, AI-generated feedback, verifier- or reward-model training, distillation—and providers rarely disclose the exact recipe; treat SFT + RLHF as the canonical example, not the universal pipeline. Three practical consequences hold across the family. First, the assistant’s “default” answer to a vague prompt reflects what raters preferred for similar prompts—which is why defaults are informative (Session 2). Second, safety and refusal behaviour is learned and therefore imperfect: treat prompt-layer behaviour as probabilistic and bound the consequences with application-level permissions, validation and human approval (Session 8). Third, none of this changes the mechanism: an instruction-tuned model still completes a context; it has been shaped so that the most probable completion of a request is a good response.</p>\n   <p>A further, provider-specific stage is now common: reasoning-oriented post-training, which produces models that perform extended internal reasoning before answering (“reasoning” or “thinking” models). The methods vary and are often undisclosed. Session 4 treats these models as a distinct regime.</p>"}, {"t": "figure", "caption": "Figure 1.4 — From corpus to assistant. Each stage narrows the distribution of likely completions toward useful ones without changing the underlying mechanism. The first three boxes follow Ouyang et al. (2022); the fourth is provider-specific and its methods are often undisclosed.", "notice": ["Pre-training supplies capability and knowledge; the later stages supply behaviour.", "Preferences are learned from comparisons between outputs, not from rules written down.", "Reasoning-oriented post-training is a fourth, provider-specific stage; its recipes vary and may be proprietary."], "svg": "<svg viewBox=\"0 0 720 200\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#4A5563\"/></marker></defs>\n <rect x=\"20\" y=\"40\" width=\"160\" height=\"115\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"40\" width=\"160\" height=\"8\" fill=\"#5B6672\"/><text x=\"100\" y=\"70\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Pre-training</text><foreignObject x=\"28\" y=\"80\" width=\"144\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:var(--sans);font-size:11.5px;color:#4A5563;line-height:1.35\">next-token prediction on a large corpus<br/><b style=\"color:#1B2431\">→ capability + knowledge</b></div></foreignObject><path d=\"M180,95 L195,95\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"195\" y=\"40\" width=\"160\" height=\"115\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"195\" y=\"40\" width=\"160\" height=\"8\" fill=\"#2C5A8A\"/><text x=\"275\" y=\"70\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Supervised fine-tuning</text><foreignObject x=\"203\" y=\"80\" width=\"144\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:var(--sans);font-size:11.5px;color:#4A5563;line-height:1.35\">prompt → ideal response demonstrations<br/><b style=\"color:#1B2431\">→ the form of assistance</b></div></foreignObject><path d=\"M355,95 L370,95\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"370\" y=\"40\" width=\"160\" height=\"115\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"370\" y=\"40\" width=\"160\" height=\"8\" fill=\"#3F7A57\"/><text x=\"450\" y=\"70\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Preference tuning</text><foreignObject x=\"378\" y=\"80\" width=\"144\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:var(--sans);font-size:11.5px;color:#4A5563;line-height:1.35\">comparisons → reward model → optimise<br/><b style=\"color:#1B2431\">→ judgement, tone, safety</b></div></foreignObject><path d=\"M530,95 L545,95\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"545\" y=\"40\" width=\"160\" height=\"115\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"545\" y=\"40\" width=\"160\" height=\"8\" fill=\"#6B4C8A\"/><text x=\"625\" y=\"70\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Reasoning post-training</text><foreignObject x=\"553\" y=\"80\" width=\"144\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family:var(--sans);font-size:11.5px;color:#4A5563;line-height:1.35\">provider-specific; RL, verifiers, distillation…<br/><b style=\"color:#1B2431\">→ reasons at length before answering</b></div></foreignObject>\n <text x=\"360\" y=\"185\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">Ouyang et al. (2022); the fourth stage is more recent and varies by provider</text>\n </svg>", "alt": "Four boxes in a row joined by arrows: Pre-training (next-token prediction on a large corpus → capability + knowledge); Supervised fine-tuning (prompt → ideal response demonstrations → the form of assistance); Preference tuning (comparisons → reward model → optimise → judgement, tone, safety); Reasoning post-training (provider-specific; RL, verifiers, distillation → reasons at length before answering)."}, {"t": "misconceptions", "items": [{"claim": "A bigger context window means I can paste everything in and the model will use it.", "truth": "Capacity is not attention. Positional effects such as lost-in-the-middle (model-dependent), dilution of instructions, and compute cost all get worse as you fill the window. More context helps only when it is relevant and well placed."}, {"claim": "The model knows the answer; it just sometimes says it wrong.", "truth": "There is no separate ‘knowing’. There is a distribution over next tokens shaped by the context. A ‘known’ fact is one with a high-probability continuation; a wrong answer is a lower-probability draw or a shifted distribution."}, {"claim": "Setting temperature to 0 makes the model deterministic and correct.", "truth": "It makes decoding greedy or near-greedy, which removes most sampling variance but not error: the argmax can be wrong, hosted inference is not guaranteed to be perfectly deterministic, and tiny wording changes can flip the result. Greedy decoding also tends toward repetitive, generic text on open-ended tasks."}, {"claim": "Tokens are words.", "truth": "Tokens are corpus-frequent character or byte sequences. A common English word is one token; a rare word, a number, a code symbol or a word in an under-represented language is often several. Letter-level tasks can be brittle partly because letters are not the unit."}]}, {"t": "concept", "html": "An LLM turns text into corpus-frequent tokens, attends over all of them within a finite window, and samples the next token from a distribution that everything in the window has shaped. Cost, capacity, perception and error all follow from those three facts."}, {"t": "check", "items": [{"q": "Explain, in next-token terms, why “Let me be honest” at the start of an answer might change what follows, even though it adds no information.", "a": "The phrase conditions the distribution: continuations that read as candid, hedged or self-critical become more probable because that is what follows such phrases in training text. The content of the answer is drawn from a shifted distribution."}, {"q": "You need the model to compare two 12-page contracts. Sketch two context strategies and say which lost-in-the-middle would punish more.", "a": "Strategy A: both contracts in one call, instructions first and repeated last; B: extract the relevant clauses from each with separate calls, then compare the extracts. A puts the comparison target in the middle of ~15k tokens and is punished most; B keeps each call short and the relevant text near the ends."}, {"q": "Why does spelling <em>strawberry</em> with spaces between letters help counting, and what does that tell you about designing inputs generally?", "a": "Each spaced letter becomes its own token, so the letters are directly visible rather than inferred from chunk identities. General lesson: reshape the input so the units the task needs are the units the model perceives—the same logic later motivates delimiters and structured formats. (And for exact counts in production, use a deterministic tool.)"}], "gated": true}, {"t": "exercise", "box": "Exercise 1A — Calibrate your token intuition", "html": "<p>Use the course token counter (it names the tokenizer and version it uses) on the five strings from Opening prediction 1, then on three strings of your own choosing designed to be <em>surprising</em> (one you think will be cheap but is not; one the reverse; one non-English). Record guess vs. actual for all eight before opening the analysis panel.</p><p>Then write a rule of thumb in one sentence that would have predicted at least six of the eight.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template (no expected counts are given in advance).</strong> For each string compute the absolute error between guess and actual and name the token feature that explains the largest error (leading space, punctuation, digits, non-English script, rare word). Compare your rule of thumb with the reference table generated by the exact study tokenizer, which unlocks after submission in the course pack. Update your rule in one sentence.</p>"}, {"t": "exercise", "box": "Lab 1B — Make a letter-counting task solvable", "html": "<p>Ask the AI: <code>How many times does the letter r appear in “strawberry”?</code> three times with sampling on. Record answers. Then ask it to first write the word with a space between every letter, then count. Three runs. Then try a harder word (<em>Mississippi</em>, count <em>s</em>).</p><p>Before running the spaced version, write down what you expect to change and why (one sentence). Note whether the model used any tool or visible reasoning.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> Report accuracy in each condition with the run count and the model/version. No direction is assumed: current models differ widely on this task, and some count correctly unspaced. State one mechanism consistent with <em>your</em> data (chunk-level input; sequential counting in one pass; use of a tool), and what further run would distinguish it from an alternative.</p>", "lab": true}, {"t": "task", "box": "Lab 1C — The 600-token brief", "html": "<p>You receive a 900-token product description and two customer questions. Produce a prompt that fits in <strong>400 tokens total</strong> (instructions + material) and still lets the AI answer both correctly.</p><ol><li>Before editing, highlight the passages each question depends on. Estimate their combined size.</li><li>Compress in two named passes: pass 1 remove-by-relevance; pass 2 compress and restructure. Save a version after each with its token count.</li><li>Test each version on both questions. Record which question first fails at which budget, and <em>why</em> (missing fact? ambiguity? instruction dropped?).</li><li>Write two lines: what “cut from the end” would have lost, and what “cut from the start” would have lost.</li></ol><p>Extension: the 1,400-token brief with three questions and a 600-token budget.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "lab": true}, {"t": "exercise", "box": "Exercise 1D — Test the U-shape on your model", "html": "<p>Take the 2,500-token filler passage from the course pack, which has insertion markers at 5%, 50% and 95%. Insert the sentence “The Zorbat festival is held on 14 March.” at each position in turn. In the core session, ask “When is the Zorbat festival?” <em>once</em> per position with sampling on, question placed <em>after</em> the passage, and once more in the 50% condition with the question also placed before; the replication with three runs per condition is Lab 1D (full, take-home) (take-home).</p><p><strong>Before running</strong>, write two hypotheses with a predicted direction and the smallest difference you would call meaningful: H1, middle placement vs. edge placement; H2, the effect of also placing the question <em>before</em> the passage in the 50% condition. Then run both.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> Tabulate accuracy by position (and by question placement for H2) with run counts and model/version. Compare with your preregistered hypotheses. The literature comparison—Liu et al.’s 2023 U-shape—unlocks in the course pack after you submit the table; a flat result on a current long-context model is a valid and interesting finding, not a failed replication.</p>"}, {"t": "stretch", "box": "Stretch 1E — Dilution vs. truncation", "html": "<p>Design an experiment that distinguishes the two explanations of “forgetting” in 1.3 (the instruction is no longer supplied vs. it is supplied but diluted). Hint: you control whether the early instruction is actually still in the window. Predeclare the two conditions, at least 10 trials per condition (or a justified alternative), the outcome metric, and a simple uncertainty summary (a binomial confidence interval for each success rate is enough). Report which explanation your data supports and how wide the intervals are.</p>"}, {"t": "selfscore", "criteria": ["I saved Opening prediction 1 before reading and wrote one line on how it compared afterwards.", "I wrote a 2–3 sentence explanation of how a subword tokenizer builds its vocabulary, without notes, and checked it against 1.2.", "I ran at least one experiment with multiple samples and recorded the model, version and settings.", "I recorded one problem from this session that is better solved outside the prompt.", "I wrote a transfer statement with a specific trigger and a measure."]}, {"t": "reflect", "box": "Reflection 1", "prompt": "<p>Return to Opening prediction 1. Which belief changed, and which piece of theory or data changed it? Then complete: “The next time I write a long prompt I will ____ because ____.”</p><p>Finish with: “In my next real task, I will [specific behaviour] when [trigger], and I will judge it by [observable measure].”</p>"}], "core": ["Opening prediction (5)", "Theory 1.1–1.5 with checkpoint, MCQ, misconceptions, checks (25)", "Exercise 1A token calibration (10)", "Exercise 1D U-shape, one run per condition (12)", "Self-score + reflection (5)"]}, {"id": 2, "title": "The Anatomy of a Prompt", "covers": "Week 2: Role, Task, Context, Constraints, Output Format.", "bigq": "A vague prompt does not produce a vague answer. What does it produce, and why?", "slides": [{"t": "objectives", "items": ["Decompose a prompt into five components and identify which are missing or under-specified.", "Predict how a model will resolve an under-specified request by reasoning about what is typical in training data.", "Rewrite a vague request into a structured prompt, justify each addition, and remove additions that do not earn their place.", "Explain why explaining a goal often outperforms adding rules, and why negative rules under-perform positive ones."]}, {"t": "think", "box": "Opening prediction 2", "prompt": "<p>A colleague sends the AI: <code>Write something about our new product for the website.</code></p><p>List <strong>seven</strong> decisions the model must make on its own (length is one). For each, write what you think the model will choose and whether that matches what a real marketing colleague would want (Likely / Unlikely). Then predict: which single missing piece of information would, if added, change the output most?</p>"}, {"t": "theory", "heading": "2.1 Every gap is filled by a guess", "html": "\n   <p>From Session 1: the model completes the context with the most plausible continuation. When a prompt omits the audience, the model assumes the audience typical for such requests in its training data; when it omits length, it picks a typical length; when it omits purpose, it infers the most common purpose. Each omission is resolved not at random but toward the model’s <em>learned priors</em>—what its training and post-training made typical for requests like this—combined with whatever the runtime context supplies (system instructions, tools, product policy, conversation state). That is why vague prompts produce a strangely consistent kind of output—generic marketing prose, a five-paragraph essay, a bulleted summary of six points—and why that output feels “fine but not what I meant”.</p>\n   <p>The consequence is a diagnostic principle: <strong>the model’s default is informative</strong>. It tells you what the average request of this kind looked like, and therefore which of your own requirements are non-default and must be stated. Prompt engineering at this level is the discipline of noticing which gaps you left and deciding which ones matter enough to close. Closing all of them is not the goal: each added sentence costs tokens, adds a constraint the model must trade off against others, and can push the output away from something it would have done well unprompted.</p>\n   <p>Make the high-impact choices explicit when defaults matter. A useful decomposition, consistent with provider guidance (Anthropic; OpenAI) and the survey literature (Liu et al., 2023; Reynolds & McDonell, 2021), has five components. They are not a template to fill in; they are five questions to ask of any prompt.</p>"}, {"t": "theory", "heading": "2.2 The five components in depth", "html": "\n   <h4>Role / persona — “who is answering?”</h4>\n   <p>A role conditions the distribution toward a genre of text: “senior technical writer” brings vocabulary, structure and a sense of what counts as done. It works because professional genres are well represented in training data. It adds little to tasks with no genre (arithmetic), and can mislead when the persona’s typical output is not what you want (“brilliant physicist” produces jargon). Roles also carry <em>implicit constraints</em> you may not intend: a “friendly assistant” hedges; a “lawyer” caveats.</p>\n   <h4>Task — “what verb, what object?”</h4>\n   <p>“Summarise”, “extract the decisions”, “rewrite for a new audience” and “critique” are different operations on the same text. Loose verbs are the commonest source of adjacent-but-wrong output. If the task has stages, list them in execution order—this often improves compliance. Do not assume the model cannot plan: on reasoning models, internal planning may precede the visible answer.</p>\n   <h4>Context — “what does the model need to know?”</h4>\n   <p>Purpose, audience, background facts and source material. Purpose is often the highest-leverage item for open-ended communication tasks: “this will be read on a phone by a CEO deciding whether to attend” implies length, register, ordering and content selection at once, and lets the model generalise to cases no rule anticipated. For debugging, extraction or tool use, the materials, schema or constraints usually dominate instead—diagnose with ablations (Lab 2D) rather than assuming. Provider guidance is explicit on this: explain <em>why</em>, not just <em>what</em>.</p>\n   <h4>Constraints — “what must be true of the output?”</h4>\n   <p>Length, reading level, required inclusions, forbidden content, style. Prefer instructions that specify the desired output when that is clearer than a prohibition: “write in short declarative sentences” tells the model what to produce, “don’t be verbose” only what to avoid. Whether negative wording is actually followed less reliably is model- and task-dependent—a heuristic to test (Lab 2C), not a law. When a prohibition is needed, pair it with the positive alternative: “do not use bullet points; write flowing paragraphs”.</p>\n   <h4>Output format — “what shape?”</h4>\n   <p>Headings, a table, JSON with a named schema, exactly one paragraph, a specific language. Format instructions are among the most reliably followed, are cheap to test, and make downstream processing possible. State them last, right before the model begins writing, where recency helps.</p>"}, {"t": "figure", "caption": "Figure 2.1 — Anatomy of a structured prompt. The five components answer five different questions; anything left unspecified is resolved from the model’s learned priors plus the runtime context and decoding settings.", "notice": ["For many open-ended communication tasks, purpose is a high-leverage part of Context; for extraction, coding or tool use, other components may dominate.", "Format goes last, where recency helps and where the model is about to start writing.", "Nothing here is mandatory: each block is a decision to close a gap, not a field to fill."], "svg": "<svg viewBox=\"0 0 720 300\" xmlns=\"http://www.w3.org/2000/svg\">\n <rect x=\"20\" y=\"20\" width=\"680\" height=\"46\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"20\" width=\"8\" height=\"46\" fill=\"#6B4C8A\"/><text x=\"42\" y=\"40\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Role</text><text x=\"42\" y=\"58\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">who is answering?</text><text x=\"690\" y=\"49\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">genre, vocabulary, implicit norms</text><rect x=\"20\" y=\"74\" width=\"680\" height=\"46\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"74\" width=\"8\" height=\"46\" fill=\"#2C5A8A\"/><text x=\"42\" y=\"94\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Task</text><text x=\"42\" y=\"112\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">what verb, what object?</text><text x=\"690\" y=\"103\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">scope; order of stages</text><rect x=\"20\" y=\"128\" width=\"680\" height=\"46\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"128\" width=\"8\" height=\"46\" fill=\"#3F7A57\"/><text x=\"42\" y=\"148\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Context</text><text x=\"42\" y=\"166\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">what must the model know?</text><text x=\"690\" y=\"157\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">purpose · audience · facts · materials</text><rect x=\"20\" y=\"182\" width=\"680\" height=\"46\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"182\" width=\"8\" height=\"46\" fill=\"#B0741E\"/><text x=\"42\" y=\"202\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Constraints</text><text x=\"42\" y=\"220\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">what must be true of the output?</text><text x=\"690\" y=\"211\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">ranges; positive targets; few</text><rect x=\"20\" y=\"236\" width=\"680\" height=\"46\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"236\" width=\"8\" height=\"46\" fill=\"#5B6672\"/><text x=\"42\" y=\"256\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Output format</text><text x=\"42\" y=\"274\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">what shape?</text><text x=\"690\" y=\"265\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">schema, length, language, example</text>\n <text x=\"360\" y=\"292\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">Unstated components are resolved from learned priors plus runtime context</text>\n </svg>", "alt": "Five stacked rows, each with a coloured left bar: Role (who is answering? — genre, vocabulary, implicit norms); Task (what verb, what object? — scope; order of stages); Context (what must the model know? — purpose, audience, facts, materials); Constraints (what must be true of the output? — ranges; positive targets; few); Output format (what shape? — schema, length, language, example). Footer: unstated components are resolved from learned priors plus runtime context."}, {"t": "example", "box": "Worked example: from vague to structured, with reasons", "html": "\n   <p><strong>Before:</strong> <code>Write something about our new product for the website.</code></p>\n<pre>[Role] You are a marketing copywriter for a small software company.\n[Task] Write the introductory paragraph for the product page of \"Ledgerly\", an invoicing app.\n[Context] Audience: freelancers who currently invoice with spreadsheets. Facts you may use: sends invoices in 30 seconds; tracks unpaid invoices automatically; free for up to 5 clients per month. Purpose: get the reader to click \"Start free\".\n[Constraints] 60–90 words. Plain English; write as if to one person. Use only the facts above—do not invent features or numbers.\n[Format] One paragraph ending with a single short call-to-action sentence.</pre>\n   <p><strong>Why each line is there:</strong> the role fixes genre; the task fixes scope (one paragraph, one page, one product); “freelancers who use spreadsheets” tells the model what pain to address; the fact list plus “use only” closes the hallucination gap; “as if to one person” replaces a page of tone rules; the word range replaces vague “short”; the CTA instruction makes the ending checkable.</p>\n   <p><strong>What is deliberately absent:</strong> brand voice guidelines, SEO keywords, competitor comparisons. If those matter they can be added, but each is a new constraint to trade off, and the first draft is the place to find out whether they were needed.</p>"}, {"t": "predict", "box": "Checkpoint 2", "prompt": "<p>Two constraint phrasings for the same intent: (A) “Do not use bullet points.” (B) “Write in continuous prose with no lists.” Predict which is followed more reliably across ten runs of a summarisation task, and estimate the gap (e.g. “A 6/10, B 9/10”). One sentence on the mechanism.</p>", "reveal": "<p>There is no predetermined winner. The affirmative form (B) is often <em>clearer</em>—it names the target pattern—and in some model/task combinations it is followed more reliably; in others the two tie. Ten runs can only detect a large gap, so a small difference is inconclusive. The right response to any claim about positive versus negative phrasing is the measurement in Lab 2C: compare compliance rates on your model, report run counts, and if the conditions tie, record that as evidence against a universal rule for this model.</p>"}, {"t": "theory", "heading": "2.3 Diagnosing failures by missing component", "html": "\n   <table><tr><th>Symptom</th><th>Likely cause</th><th>First fix to try</th></tr>\n   <tr><td>Right content, wrong register or jargon level</td><td>Audience / role unstated</td><td>Name the reader and their situation</td></tr>\n   <tr><td>Did something adjacent to what you asked</td><td>Task verb too loose</td><td>Replace the verb; list stages</td></tr>\n   <tr><td>Invented facts, or ignored the facts you gave</td><td>Materials absent, or not marked as the only source</td><td>Supply them in delimiters; say “use only”</td></tr>\n   <tr><td>Correct but useless for its purpose</td><td>Purpose unstated</td><td>Say what the output is for and who acts on it</td></tr>\n   <tr><td>Too long / short / wrong style</td><td>Constraints missing or negative-only</td><td>Give ranges and positive targets</td></tr>\n   <tr><td>Correct but needs reformatting</td><td>Output format unstated</td><td>Specify shape; give a one-line example</td></tr>\n   <tr><td>Follows most rules, drops one</td><td>Too many constraints competing</td><td>Remove the least important; explain the goal instead</td></tr></table>\n   <p>The last row is the one people miss. A model satisfying twelve constraints treats them as soft preferences to trade off; when they conflict—even subtly—it will sacrifice one, and not necessarily the one you would have chosen. Fewer, clearer constraints plus a stated purpose usually beats a long rule list.</p>"}, {"t": "theory", "heading": "2.4 Surface form matters more than it should", "html": "\n   <p>Sclar et al. (2023) measured how much few-shot accuracy changed under formatting variations that preserve meaning: swapping a colon for an arrow, changing the casing of a label, altering whitespace between examples. Across several open models and tasks they found differences of up to 76 accuracy points between the best and worst format of the <em>same</em> prompt (LLaMA-2-13B), and the best format for one model was not the best for another. The magnitude is highly model- and task-dependent
