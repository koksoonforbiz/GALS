—a historical result on 2023 open models—but the direction of the lesson holds. There was no reliably good format—only formats that had to be tested.</p>\n   <p>Two lessons. First, a prompt that “looks right” is not evidence that it behaves well; measurement is (Session 6). Second, formatting is part of the prompt’s meaning to the model, because format was part of the statistical regularity it learned. Use one consistent format throughout a prompt, and when you change a prompt, change one thing at a time so you can attribute any effect.</p>\n   <p><strong>Over-specification</strong> is the complementary failure. Long prompts that pre-empt every case give the model many constraints to satisfy simultaneously; it may sacrifice an important one to satisfy a trivial one, and it has less “room” to do the task well. When in doubt, explain the goal, give one good example, and add rules only when a measured failure demands them.</p>"}, {"t": "theory", "heading": "2.5 Prompt templates, variables and format control", "html": "\n   <p>In applications a prompt is rarely written once; it is a <em>template</em> with slots—<code>{{document}}</code>, <code>{{question}}</code>, <code>{{user_name}}</code>—filled at run time. Three things follow. The static part of the template (role, rules, examples) is fixed overhead paid on every call, so it should be as short as it can be while still working (Session 1). The dynamic part is untrusted: whatever fills <code>{{document}}</code> may contain instructions, which is why slots should be wrapped in delimiters (Session 5). And the boundary between static and dynamic is where version control belongs: the template is code; the fill is data.</p>\n   <p><strong>Ordering.</strong> A useful default is to keep instructions close to the material they govern and to place the final task near the end; for long materials, state the operative instruction before them and repeat it after. Provider guidance differs on details (some long-context guidance recommends materials first, then the question), so choose the ordering empirically with an evaluation set (Session 6) rather than from a rule.</p>\n   <p><strong>Format control.</strong> The strongest controls are the ones the provider enforces rather than the ones the model is asked to follow. Where the API offers <em>provider-native structured output</em>—a JSON schema the response must satisfy—use it; it removes syntax and shape errors by construction, within the provider’s supported schema subset (Session 5.3 covers what it does and does not guarantee). Where it does not, a one-line example of the exact output and an explicit “output only the JSON object” instruction are the next best controls. A legacy technique, <em>assistant prefill</em> (beginning the assistant’s turn yourself with <code>{</code> or <code>Step 1:</code>), is provider-specific and no longer supported by some current model families; treat it as historical.</p>\n   <p>Finally, <strong>prompt caching</strong> (offered by several providers) makes a long, stable prefix cheap to reuse across calls. It rewards putting everything that does not change—system prompt, examples, reference documents—at the start, and everything that varies at the end. The performance advice and the cost advice point the same way.</p>"}, {"t": "figure", "caption": "Figure 2.2 — A production prompt as template plus fill. Stable text at the top is cacheable and version-controlled; the slot contents are untrusted data; the request and output control sit last.", "notice": ["The template is code: it lives in version control with a test set (Session 6).", "Each slot is a place where untrusted content enters; delimiters mark the boundary.", "Output shape is controlled by a provider-native schema where available, otherwise by an exact example and validation in code."], "svg": "<svg viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\">\n <rect x=\"20\" y=\"20\" width=\"420\" height=\"220\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/>\n <rect x=\"21\" y=\"21\" width=\"418\" height=\"70\" fill=\"#EEF3F9\"/><text x=\"34\" y=\"42\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">System: role · scope · hard rules · defaults</text><text x=\"34\" y=\"62\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">stable → cacheable, versioned</text><text x=\"34\" y=\"80\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">few-shot examples (if any)</text>\n <rect x=\"34\" y=\"100\" width=\"392\" height=\"46\" fill=\"#FBF3E4\" stroke=\"#B0741E\" stroke-dasharray=\"4 3\"/><text x=\"44\" y=\"120\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">&lt;document&gt; {{document}} &lt;/document&gt;</text><text x=\"44\" y=\"138\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">slot: untrusted data, delimited</text>\n <text x=\"34\" y=\"170\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Task restated · question · output format</text>\n <rect x=\"34\" y=\"185\" width=\"392\" height=\"40\" fill=\"#EDF4EF\"/><text x=\"44\" y=\"203\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Output control:</text><text x=\"180\" y=\"203\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">schema / example</text><text x=\"44\" y=\"219\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">provider-native schema where available</text>\n <g transform=\"translate(470,30)\"><text x=\"0\" y=\"14\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Where things go</text>\n <text x=\"0\" y=\"44\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">▲ top: stable, long-lived, cheap to cache</text><text x=\"0\" y=\"70\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">■ middle: materials (weakest attention)</text><text x=\"0\" y=\"96\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">▼ bottom: request, format, restated rule</text>\n <text x=\"0\" y=\"136\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Version control</text><text x=\"0\" y=\"160\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">template v3.2 + test set → tracked</text><text x=\"0\" y=\"180\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">slot contents → logged, not tracked</text></g>\n </svg>", "alt": "Left: a tall box representing a prompt. Top section (shaded): “System: role · scope · hard rules · defaults — stable → cacheable, versioned; few-shot examples (if any)”. Middle: a dashed box “<document> {{document}} </document> — slot: untrusted data, delimited”. Below: “Task restated · question · output format”. Bottom (shaded): “Output control: schema / example — provider-native schema where available”. Right: notes “top: stable, long-lived, cheap to cache; middle: materials (weakest attention); bottom: request, format, restated rule” and “template v3.2 + test set → tracked; slot contents → logged, not tracked”."}, {"t": "mcq", "q": "A product-description prompt carries a 400-word voice guide, twelve banned words, three tone adjectives and “under 100 words”. The output is 160 words and uses two banned words. What is the best next step?", "options": [{"t": "Add stronger wording to every constraint and rerun the same single example.", "ok": false, "fb": "More emphasis adds more competing requirements; one output cannot tell you which rule is being dropped or why."}, {"t": "Test representative cases, then remove competing requirements one at a time.", "ok": true, "fb": "Constraint competition is a plausible hypothesis, not a verdict from one output. Controlled ablation on several inputs distinguishes it from a counting or wording problem."}, {"t": "Replace the word limit with a character limit and keep every other requirement.", "ok": false, "fb": "This changes the unit without testing whether the limit, or the competition between rules, is the problem."}]}, {"t": "misconceptions", "items": [{"claim": "A detailed persona (“you are a world-class expert with 30 years’ experience”) makes answers more accurate.", "truth": "Roles shift style and genre, not knowledge. Grandiose personas mostly make the output more confident and more jargon-laden. A plain, specific role (“a technical writer for non-technical users”) gives better control."}, {"claim": "If the model got it wrong, add a rule that forbids the mistake.", "truth": "Sometimes. But rules accumulate, compete, and can suppress good behaviour. First ask which component was missing; a stated purpose often fixes several symptoms at once."}, {"claim": "The five components should all be present in every prompt.", "truth": "They are five questions, not five mandatory fields. A good prompt closes the gaps that matter for this task and leaves the rest to the model’s (often sensible) defaults."}, {"claim": "Positive phrasing always beats negative phrasing.", "truth": "Affirmative instructions are often clearer because they name the target. Whether negative wording is followed less reliably varies by model and task; test it (Lab 2C) rather than assume it."}]}, {"t": "concept", "html": "Every omission in a prompt is filled by the mode of the training distribution. Role, Task, Context, Constraints and Format are five questions for finding the omissions that matter. State purpose, prefer positive constraints, keep the list short, and test the surface form rather than trusting it."}, {"t": "check", "items": [{"q": "Explain why “the reader is a hospital administrator deciding whether to fund this” can replace several explicit constraints, and name two it replaces.", "a": "Purpose plus reader implies register (formal), content selection (costs, outcomes, risks), ordering (decision-relevant first) and length (short). It replaces, e.g., “be formal” and “lead with the financial impact”."}, {"q": "You inherit a prompt with eleven rules. Describe a procedure for finding which ones are load-bearing.", "a": "Build a small test set; remove one rule at a time; re-run; keep the rules whose removal causes a measured regression. Expect several to be inert and one or two to be harmful."}, {"q": "Why should you distrust the claim “colons work better than arrows in few-shot examples”?", "a": "Sclar et al. found format effects are large but model- and task-specific; the right format has to be measured for your model and task, not inherited as a rule."}], "gated": true}, {"t": "exercise", "box": "Exercise 2A — Surface the assumptions", "html": "<p>Send the colleague’s vague prompt exactly as written. Compare the output with your seven predictions and score yourself. Then ask:</p><pre>Before writing anything, list every assumption you would have to make to complete this request, ordered by how much each would change the output.</pre>\n   <p>Which assumptions did the model list that you did not? Which did you list that it did not? Write two sentences on the gap.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> Count the assumptions unique to your list and unique to the model’s. For the one whose omission most changed the output, write a one-line counterfactual: the sentence that, added to the prompt, would have removed it. Keep the assumption-listing prompt—it is a reusable tool for any vague request.</p>"}, {"t": "task", "box": "Task 2B — Prompt surgery", "html": "<p>Core: P1 only. Lab 2B (full, take-home) (take-home): P2 and P3. For each prompt: P1 <code>Summarise this article.</code> · P2 <code>Fix my code.</code> · P3 <code>Help me prepare for the interview.</code></p>\n   <ol type=\"a\"><li>Fill a five-row table: present / missing / most damaging omission, with one line of reasoning per row.</li><li>Rewrite, annotating every added sentence with its component in brackets. Aim for the <em>shortest</em> rewrite that closes the damaging gaps.</li><li>Run original and rewrite twice each. Record what specifically improved, what did not change, and any added line you now think was unnecessary.</li></ol> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>"}, {"t": "exercise", "box": "Lab 2C — Positive vs. negative constraints", "html": "<p>Take a 500-word article. Prompt A: “Summarise this. Do not use bullet points.” Prompt B: “Summarise this in continuous prose with no lists.” Ten runs each, sampling on. Count compliant outputs. Then design prompt C that you predict beats both, and run it ten times.</p>", "expect": "<p><strong>Analysis template.</strong> Report compliance for A, B and C with run counts and model/version, and the observed differences. State whether the result supports the mechanism you wrote down before running. If A and B tie, that is a valid result and evidence against a universal rule for this model; do not reinterpret it to preserve the theory.</p>", "lab": true}, {"t": "exercise", "box": "Lab 2D — The minimum viable prompt", "html": "<p>Take your best rewrite from Task 2B. Build a fixed five-input mini-set for the task (five articles, five bug reports, or five interview briefs from the course pack). Remove one component at a time and run the ablated prompt once per input at the temperature you would use in production; score task success per input, not the look of one output. Find the smallest prompt that still succeeds on all five. Before starting, write which component you predict is load-bearing.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> For each task record which component was load-bearing and compare with your preregistered prediction. No component is designated in advance; different task types are bottlenecked by different information, and that is the finding to write up.</p>", "lab": true}, {"t": "stretch", "box": "Stretch 2E — Format sensitivity audit", "html": "<p>Pick a classification prompt with three few-shot examples. Create four cosmetic variants (label separator, casing, blank lines between examples, ordering of the instruction and examples). Run each on the same 15 inputs. Report the spread in accuracy and whether any variant changed which inputs failed. Relate your result to Sclar et al.</p>"}, {"t": "selfscore", "criteria": ["I saved my seven predicted defaults before seeing the output and scored them against it.", "I wrote a 2–3 sentence explanation of why purpose can replace several explicit constraints, and checked it against 2.2.", "I ran a comparison with a stated run count rather than judging from a single output.", "I removed at least one component I had added and recorded the measured effect.", "I recorded one rule I over-rely on and the specific thing I will do instead."]}, {"t": "reflect", "box": "Reflection 2", "prompt": "<p>Which component do you personally tend to omit, and which do you over-specify? Write one rule you will apply next session to catch each.</p><p>Finish with: “In my next real task, I will [specific behaviour] when [trigger], and I will judge it by [observable measure].”</p>"}], "core": ["Opening prediction (5)", "Theory 2.1–2.5 with checkpoint, MCQ, misconceptions, checks (25)", "Exercise 2A assumptions (8)", "Task 2B prompt surgery, P1 only (15)", "Self-score + reflection (5)"]}, {"id": 3, "title": "Learning from Examples: Zero-Shot and Few-Shot", "covers": "Week 3: in-context learning and multi-example inputs.", "bigq": "If the labels in your examples were secretly wrong, how much would it matter?", "slides": [{"t": "objectives", "items": ["Explain in-context learning as conditioning, and say what examples do and do not teach.", "Predict the effects of label balance, order and format on few-shot predictions, and name the biases involved.", "Decide, for a given task, whether examples earn their token cost, and choose examples that cover the label space and the decision boundary.", "Evaluate a few-shot prompt on held-out data and iterate with stated hypotheses."]}, {"t": "think", "box": "Opening prediction 3", "prompt": "<p>Classify support messages as BILLING, TECHNICAL, FEEDBACK or OTHER. For a held-out set of messages, predict the <em>direction</em> of accuracy change relative to zero-shot for each strategy below, name one mechanism per prediction, and rank (c), (d) and (e) from most to least harmful.</p><ol type=\"a\"><li>zero-shot: labels and one instruction (the baseline);</li><li>four examples, one per class;</li><li>eight examples, all BILLING and TECHNICAL;</li><li>four examples with deliberately <em>wrong</em> labels;</li><li>four examples, correct labels, but all four are long angry messages while the test set is mostly short and neutral.</li></ol><p>Precise percentages are not required until a model and dataset are fixed; direction plus mechanism is the commitment.</p>"}, {"t": "theory", "heading": "3.1 In-context learning is conditioning, not training", "html": "\n   <p>Brown et al. (2020) showed that GPT-3 could perform tasks it was never fine-tuned for when the prompt contained a few input–output pairs. They named the regimes <em>zero-shot</em> (instruction only), <em>one-shot</em> and <em>few-shot</em> (typically 2–32 demonstrations), and found few-shot performance improved sharply with model scale. Nothing is learned in the parametric sense: the weights are frozen. The demonstrations are context, and the model’s next-token prediction is conditioned on them. Examples make the desired continuation more probable by showing what it looks like.</p>\n   <p>That framing predicts both the power and the limits of examples. Power: format, label vocabulary, level of detail and register are all things a model can copy from a demonstration far more precisely than from a description—“answer with one of these four words in capitals” is worth less than four examples that do exactly that. Limits: the weights do not change, so demonstrations cannot install knowledge the model lacks, and a single counter-example rarely overrides a strong prior. In-context learning can nevertheless induce a task, a mapping or a procedure within the context that the model would not otherwise produce, so it is more than simple selection among pre-existing behaviours; how much more is an active research question.</p>\n   <p>One more consequence: demonstrations are paid for on every call. Eight examples of 60 tokens each add ~500 tokens of fixed overhead, forever. With instruction-tuned models that follow descriptions well, the first question is whether examples are needed at all.</p>"}, {"t": "theory", "heading": "3.2 What examples actually teach: the evidence", "html": "\n   <p>Min et al. (2022) ran a deceptively simple experiment across twelve models and many classification and multiple-choice tasks: they kept the demonstrations but replaced every gold label with a random label from the label set. Accuracy fell only marginally—often by a few points—and remained far above the no-demonstration baseline. Ablating other aspects instead, they found three things carried most of the benefit:</p>\n   <ol><li>the <strong>input distribution</strong>: demonstrations drawn from the same kind of text as the test inputs (swapping in out-of-domain sentences hurt more than wrong labels);</li>\n   <li>the <strong>label space</strong>: showing which answers are possible, even with wrong assignments;</li>\n   <li>the <strong>format</strong>: the input–label pairing itself, as a template to imitate.</li></ol>\n   <p>Read carefully, and within its scope—classification and multiple-choice tasks on 2022-era models—this says examples teach “what kind of answer, in what form” far more than “the mapping”. Do not generalise it to modern instruction-tuned models, to generation tasks, or to demonstrations that encode a procedure: there, labels and content can matter much more. The transferable lesson is that format, input distribution and label coverage often matter in few-shot classification, that correct labels matter increasingly as the task gets subtler, and that all of these are variables to test on current models and other task types.</p>\n   <p>Zhao et al. (2021) documented three systematic biases in few-shot prediction:</p>\n   <ul><li><strong>Majority-label bias</strong>: the label most frequent among demonstrations is over-predicted.</li>\n   <li><strong>Recency bias</strong>: the label of the <em>last</em> demonstration is over-predicted, because it is closest to the query.</li>\n   <li><strong>Common-token bias</strong>: labels that are frequent words in general text (“positive”) are favoured over rare ones (“neutral”).</li></ul>\n   <p>Their most striking result: permuting the <em>same</em> four demonstrations moved GPT-3’s accuracy on a sentiment task from near chance to near state-of-the-art. Their fix—“contextual calibration”, estimating the bias with a content-free input like “N/A” and correcting for it—is not available in a chat interface, but the diagnosis is: balance, order and label wording are variables you must control.</p>"}, {"t": "figure", "caption": "Figure 3.1 — What demonstrations carry. Schematic of Min et al.’s ablations: removing the input distribution or the label space hurts more than replacing gold labels with random ones (bar lengths are illustrative).", "notice": ["Random labels cost little; wrong-domain inputs and a hidden label space cost a lot.", "The format—input paired with label—is a template the model imitates exactly.", "Scope: classification and multiple-choice tasks on 2022-era models. Do not assume the same label-insensitivity on current models or generation tasks."], "svg": "<svg viewBox=\"0 0 720 240\" xmlns=\"http://www.w3.org/2000/svg\">\n <line x1=\"220\" y1=\"30\" x2=\"220\" y2=\"200\" stroke=\"#4A5563\"/><line x1=\"220\" y1=\"200\" x2=\"680\" y2=\"200\" stroke=\"#4A5563\"/>\n <text x=\"210\" y=\"52\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">no demonstrations</text><rect x=\"221\" y=\"40\" width=\"120\" height=\"18\" fill=\"#5B6672\" opacity=\".85\"/><text x=\"210\" y=\"79\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">gold labels (full few-shot)</text><rect x=\"221\" y=\"67\" width=\"400\" height=\"18\" fill=\"#2C5A8A\" opacity=\".85\"/><text x=\"210\" y=\"106\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">random labels</text><rect x=\"221\" y=\"94\" width=\"370\" height=\"18\" fill=\"#2C5A8A\" opacity=\".85\"/><text x=\"210\" y=\"133\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">out-of-domain inputs</text><rect x=\"221\" y=\"121\" width=\"210\" height=\"18\" fill=\"#A63D3D\" opacity=\".85\"/><text x=\"210\" y=\"160\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">labels hidden (inputs only)</text><rect x=\"221\" y=\"148\" width=\"180\" height=\"18\" fill=\"#A63D3D\" opacity=\".85\"/><text x=\"210\" y=\"187\" text-anchor=\"end\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">format broken</text><rect x=\"221\" y=\"175\" width=\"150\" height=\"18\" fill=\"#A63D3D\" opacity=\".85\"/>\n <text x=\"450\" y=\"222\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">relative accuracy →</text>\n </svg>", "alt": "A horizontal bar chart of relative accuracy for six conditions: no demonstrations (short bar); gold labels, full few-shot (longest); random labels (almost as long as gold); out-of-domain inputs (much shorter); labels hidden, inputs only (shorter still); format broken (short). Bars are illustrative, not exact values."}, {"t": "predict", "box": "Checkpoint 3", "prompt": "<p>You give four demonstrations in the order BILLING, TECHNICAL, FEEDBACK, OTHER, then a query that is clearly BILLING. Then you reverse the order (OTHER last → BILLING last). Predict what happens to the BILLING prediction rate on 20 clearly-billing queries, and to the OTHER rate.</p>", "reveal": "<p>Zhao et al. observed recency bias in GPT-2/GPT-3-era few-shot classification: the label of the last demonstration is over-predicted, most visibly on ambiguous inputs. Whether, and how strongly, your model shows it is empirical—instruction-tuned models often show less, rarely none. Two controls distinguish recency from class imbalance: counterbalance the order (run several orderings and compare) or keep the counts equal and vary only which label is last. Lab 3C measures this; before the reveal was the time to commit to a predicted direction.</p>"}, {"t": "theory", "heading": "3.3 When examples earn their cost", "html": "\n   <p>Examples are justified when the description of the task is <em>less precise</em> than a demonstration would be:</p>\n   <ul><li><strong>Exact output format</strong>: a specific JSON layout, a house citation style, a fixed label vocabulary.</li>\n   <li><strong>Idiosyncratic decision boundaries</strong>: “refund complaints are BILLING even when they mention a bug” is a rule words can state but examples enforce.</li>\n   <li><strong>Register and length</strong> that are easier to show than to describe.</li>\n   <li><strong>Consistency across thousands of calls</strong>, where an instruction alone drifts.</li></ul>\n   <p>Examples are wasted or harmful when: the model is instruction-tuned and the task is standard (sentiment, translation, summarisation—zero-shot is often as good and cheaper); the demonstrations are unrepresentative of real inputs (Min et al.: distribution matters); they are so many that the actual input is buried (Session 1); or they encode a spurious correlation—every TECHNICAL example is long, every BILLING example mentions dollars—that the model will pick up faster than the intended rule. The last is the commonest silent failure: examples chosen for clarity are often too clean.</p>"}, {"t": "theory", "heading": "3.4 Selecting and structuring demonstrations", "html": "\n   <ol><li><strong>Cover the label space</strong>, including the negative/“other” class, in roughly equal numbers.</li>\n   <li><strong>Prefer boundary cases to prototypes</strong> once the format is established. A message mentioning both a bug and a charge, labelled BILLING, teaches the rule; a pure billing message teaches nothing new.</li>\n   <li><strong>Match the input distribution</strong>: length, register, noise, typos, language mix. If real inputs are messy, some examples should be.</li>\n   <li><strong>Use one consistent, explicit format</strong> with delimiters (<code>Input:/Label:</code> or XML tags). Format is imitated exactly, including your inconsistencies.</li>\n   <li><strong>Control order</strong>: randomise, or test several orders; do not end on a rare label; consider ending on the class you least want over-predicted.</li>\n   <li><strong>Keep the count modest</strong>—3 to 8 is a common starting range, not a rule; measure the marginal gain of each additional example against held-out performance, latency and token cost.</li>\n   <li><strong>Similarity-based selection</strong>: in applications, retrieving the demonstrations most similar to the current input (by embedding) has beaten fixed sets in specific studies—this is RAG applied to examples (Session 7). Tune against held-out performance; it is not a universal optimum.</li>\n   <li><strong>Never evaluate on your demonstrations.</strong> Hold out a test set.</li></ol>"}, {"t": "figure", "caption": "Figure 3.2 — Three biases observed in few-shot prediction (Zhao et al., 2021) and the mitigation most relevant to each. None is a guaranteed fix.", "notice": ["Balance can reduce majority-label bias; counterbalancing order can reveal and reduce recency effects; label wording can reduce common-token bias. None is guaranteed—measure.", "All three act on ambiguous inputs first—the confusion matrix shows where.", "When measuring performance, counterbalance or randomise order; do not rely on choosing a preferred last label."], "svg": "<svg viewBox=\"0 0 720 230\" xmlns=\"http://www.w3.org/2000/svg\">\n <rect x=\"20\" y=\"20\" width=\"215\" height=\"190\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"20\" y=\"20\" width=\"215\" height=\"8\" fill=\"#B0741E\"/><text x=\"127\" y=\"50\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Majority-label bias</text><text x=\"127\" y=\"85\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">5 × BILLING, 1 × OTHER</text><text x=\"127\" y=\"112\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">→ BILLING over-predicted</text><line x1=\"45\" y1=\"135\" x2=\"210\" y2=\"135\" stroke=\"#D9DEE5\"/><text x=\"127\" y=\"160\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">lever:</text><text x=\"127\" y=\"182\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">balance the counts (reduces)</text><rect x=\"253\" y=\"20\" width=\"215\" height=\"190\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"253\" y=\"20\" width=\"215\" height=\"8\" fill=\"#2C5A8A\"/><text x=\"360\" y=\"50\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Recency bias</text><text x=\"360\" y=\"85\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">…, last example = OTHER</text><text x=\"360\" y=\"112\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">→ OTHER over-predicted</text><line x1=\"278\" y1=\"135\" x2=\"443\" y2=\"135\" stroke=\"#D9DEE5\"/><text x=\"360\" y=\"160\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">lever:</text><text x=\"360\" y=\"182\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">counterbalance the order</text><rect x=\"486\" y=\"20\" width=\"215\" height=\"190\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><rect x=\"486\" y=\"20\" width=\"215\" height=\"8\" fill=\"#3F7A57\"/><text x=\"593\" y=\"50\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Common-token bias</text><text x=\"593\" y=\"85\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">labels: positive / neutral</text><text x=\"593\" y=\"112\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">→ frequent word favoured</text><line x1=\"511\" y1=\"135\" x2=\"676\" y2=\"135\" stroke=\"#D9DEE5\"/><text x=\"593\" y=\"160\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">lever:</text><text x=\"593\" y=\"182\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">distinctive label tokens (reduces)</text>\n </svg>", "alt": "Three side-by-side cards. Majority-label bias: example set “5 × BILLING, 1 × OTHER” → BILLING over-predicted; mitigation: balance the counts (reduces). Recency bias: “…, last example = OTHER” → OTHER over-predicted; mitigation: counterbalance the order. Common-token bias: labels “positive / neutral” → frequent word favoured; mitigation: distinctive label tokens (reduces)."}, {"t": "example", "box": "Worked example: a balanced, boundary-rich classifier", "html": "<pre>Classify each customer message into exactly one label: BILLING, TECHNICAL, FEEDBACK, OTHER.\nRule: if a message concerns a charge, invoice or refund, it is BILLING even if it also reports a bug.\nRule: general praise or complaints about the experience with no specific request are FEEDBACK.\n\n&lt;example&gt;&lt;message&gt;I was charged twice this month.&lt;/message&gt;&lt;label&gt;BILLING&lt;/label&gt;&lt;/example&gt;\n&lt;example&gt;&lt;message&gt;app crashes when i open settings on android, pixel 7&lt;/message&gt;&lt;label&gt;TECHNICAL&lt;/label&gt;&lt;/example&gt;\n&lt;example&gt;&lt;message&gt;Love the new dark mode, thanks!&lt;/message&gt;&lt;label&gt;FEEDBACK&lt;/label&gt;&lt;/example&gt;\n&lt;example&gt;&lt;message&gt;Do you have an office in Berlin?&lt;/message&gt;&lt;label&gt;OTHER&lt;/label&gt;&lt;/example&gt;\n&lt;example&gt;&lt;message&gt;The export button is broken AND you billed me for a plan I cancelled.&lt;/message&gt;&lt;label&gt;BILLING&lt;/label&gt;&lt;/example&gt;\n&lt;example&gt;&lt;message&gt;honestly the onboarding is confusing, took me an hour&lt;/message&gt;&lt;label&gt;FEEDBACK&lt;/label&gt;&lt;/example&gt;\n\n&lt;message&gt;{{INPUT}}&lt;/message&gt;\n&lt;label&gt;</pre>\n   <p>Design notes: two examples per class would be more balanced—here FEEDBACK and BILLING have two, the others one, which mildly biases toward those; the messy lowercase examples match real traffic; example 5 encodes the boundary rule and the rule is <em>also</em> stated in words; the last example is FEEDBACK, chosen because over-predicting FEEDBACK is the least costly error; the prompt ends inside <code>&lt;label&gt;</code> so the first generated token is the answer.</p>"}, {"t": "theory", "heading": "3.5 Beyond a fixed set: dynamic, negative and chain-of-thought examples", "html": "\n   <p>A fixed demonstration set is a compromise: the six examples that best cover the label space are rarely the six most relevant to any particular input. <strong>Dynamic selection</strong> resolves this by keeping a pool of labelled examples and retrieving, for each input, the <em>k</em> most similar ones (by embedding similarity—the same machinery as Session 7). Liu et al. (2022) showed retrieved demonstrations consistently beat random ones; in practice the gain is largest on tasks with many sub-types, where the relevant boundary case differs from input to input. The cost is a retrieval step per call and an example pool to maintain.</p>\n   <p><strong>Negative examples</strong>—demonstrations of what <em>not</em> to do, with a note on why—help when the model has a strong wrong prior. Shown as “Input → wrong output (because …) → correct output”, they work like written rules with evidence attached. They are more expensive in tokens and can backfire if the wrong output is more fluent than the right one (the model imitates fluency), so use them sparingly and test.</p>\n   <p><strong>Chain-of-thought exemplars</strong> are demonstrations whose output includes reasoning steps before the answer. They teach the model both the format of the reasoning and its granularity (Session 4), and they are the form in which Wei et al. originally reported chain-of-thought gains. For older, non-reasoning models, one or two worked-reasoning exemplars can help on tasks that need multi-step work. For current reasoning models (Session 4), explicit visible-reasoning exemplars may add cost or be discouraged by the provider; follow the provider’s guidance and test concise task examples against reasoning examples on your own evaluation set.</p>"}, {"t": "mcq", "q": "After you add four more TECHNICAL examples, held-out accuracy on 20 items changes from 85% to 78% on a single run. What should you do first?", "options": [{"t": "Repeat the paired evaluation and inspect which specific items changed labels.", "ok": true, "fb": "A 7-point change on 20 items is one or two items—inside run-to-run noise. Replicate; then the confusion matrix shows whether errors moved toward TECHNICAL or scattered."}, {"t": "Remove the added examples immediately because the observed score became lower.", "ok": false, "fb": "That discards information before you know whether the drop is real."}, {"t": "Rebalance the examples immediately because majority-label bias is now established.", "ok": false, "fb": "Majority-label bias is a plausible mechanism (Zhao et al.), but one small run cannot establish a cause."}]}, {"t": "misconceptions", "items": [{"claim": "More examples always improve accuracy.", "truth": "Returns diminish fast, each example costs tokens every call, and unbalanced or unrepresentative additions can reduce accuracy. Measure the marginal gain."}, {"claim": "Examples teach the model the rule.", "truth": "In the classification settings Min et al. studied, demonstrations mostly taught format, label space and input distribution. On current models, generation tasks and procedural demonstrations, labels and content matter more. Rules that contradict the model’s priors need to be stated in words and shown with boundary cases—and then tested."}, {"claim": "The order of examples doesn’t matter.", "truth": "Order can swing accuracy from chance to state-of-the-art on the same examples (Zhao et al.). Recency bias toward the last label is the main mechanism."}, {"claim": "If the prompt gets all my examples right, it works.", "truth": "Performance on demonstrations is meaningless; the model is copying them. Only held-out inputs measure anything."}]}, {"t": "concept", "html": "Demonstrations are context that shows the model the format, the label set and the kind of input to expect. They select among behaviours the model already has, are biased by their balance and order, and cost tokens every call. Use few, balanced, boundary-rich, realistic examples, control their order, and measure on held-out data."}, {"t": "check", "items": [{"q": "Why might four wrongly-labelled examples hurt less than eight correctly-labelled examples drawn from only two classes?", "a": "Within Min et al.’s scope, format, distribution and label space carried most of the benefit, so wrong labels cost less than expected; a two-class set both omits label-space coverage and can induce majority-label bias (Zhao et al.), pushing predictions into those classes. Whether the ranking holds on your model is what Exercise 3A measures."}, {"q": "Design a demonstration set that would make a model over-predict TECHNICAL on purpose. Then invert each choice to state the good-practice rule.", "a": "Five TECHNICAL examples, one of each other class, TECHNICAL last, all TECHNICAL examples long and detailed. Inverted: balance counts; do not end on the class you fear over-predicting; match lengths across classes."}, {"q": "When is zero-shot the right choice even though examples would raise accuracy by two points?", "a": "When the two points are within run-to-run noise, when the extra tokens matter at scale, or when maintaining examples (as the label scheme evolves) is a cost the team will not pay. Accuracy is one criterion among several."}], "gated": true}, {"t": "exercise", "box": "Exercise 3A — Three strategies on the development set", "html": "<p>The course pack provides a labelled <em>development set</em> (8 messages), a separate <em>final hold-out set</em> (8 messages, do not open until Task 3B step 4) and a 30-message example pool. <strong>Core:</strong> build two prompts—zero-shot, and one balanced four-shot (one per class)—and run each once on <em>four</em> development items (8 calls). Record accuracy and the class-wise errors. <strong>Lab 3A (full, take-home) (take-home):</strong> add the unbalanced eight-shot condition, run all five strategies from Prediction 3 on all development items with two repeats, and build confusion matrices.</p><p>Before running, write which class you expect each few-shot design to over-predict.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see Appendix → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> Build a confusion matrix per condition. Report which classes gained or lost and whether the unbalanced condition pulled predictions toward the shown classes. No reference accuracy is given: absolute numbers depend on the model and the eight items; the comparisons are the finding. Lab 3A (full, take-home) extends this to all five strategies from Opening prediction 3, 20 items and two repeats.</p>"}, {"t": "task", "box": "Task 3B — Engineer the example set", "html": "<p>Goal: highest accuracy on the untouched final hold-out set with at most <strong>six</strong> demonstrations from the pool—using only development-set errors to choose them. Before writing: (1) mark the development items you expect to be hardest and why; (2) write two sentences for “prototypes” and two for “boundary cases”, then choose; (3) decide which label goes last and why.</p><p><strong>Core:</strong> one iteration on the four development items, then one evaluation on the 8-item hold-out (12 calls), recording both numbers; the gap is your measure of overfitting. <strong>Lab 3B (full, take-home) (take-home):</strong> up to three iterations on the full development set, each with a written hypothesis “swapping X for Y will fix item #N because Z” and its outcome, before a single final hold-out run.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see Appendix → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>"}, {"t": "exercise", "box": "Lab 3C — Order matters: measure it", "html": "<p>Take your best six demonstrations. Run two counterbalanced orders on the development set (core), then extend to reversed, rare-label-last and one random order with two repeats each (full lab). Report the accuracy spread and which inputs flipped.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> For every input that flipped, inspect whether the flipped cases share ambiguity, length, class imbalance or a lexical cue. Report the pattern your data supports; do not assume ambiguity is the cause. Compare the size of the order effect with the run-to-run variance of a single order.</p>", "lab": true}, {"t": "exercise", "box": "Lab 3D — Let the AI choose, then audit it", "html": "<p>Ask the AI to select six demonstrations from the pool using only the development set, and to state its selection criteria. You select six the same way. Before evaluating, write which selector you predict will win and why. Evaluate both sets once on the final hold-out.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> Report both hold-out accuracies and the criteria each selector used. Keep whichever set won. Where the losing selector’s criteria were persuasive, write one sentence on the difference between a plausible criterion and a validated one. No winner is assumed.</p>", "lab": true}, {"t": "stretch", "box": "Stretch 3E — Spurious correlation trap", "html": "<p>Construct a demonstration set in which every TECHNICAL example happens to contain the word “app” and no other example does. Test on messages that mention “app” but are BILLING or FEEDBACK. Measure the leakage. Then fix the set with the fewest changes and re-measure. Write up what the model actually learned from your first set.</p>"}, {"t": "selfscore", "criteria": ["I saved a ranking of harms with one mechanism per prediction before running anything.", "I wrote 2–3 sentences on what Min et al. and Zhao et al. each showed and the scope of each, and checked them against 3.2.", "I kept development and final hold-out sets separate and evaluated on the hold-out only once.", "Each of my iterations had a written hypothesis and a recorded outcome.", "I recorded the model, version and settings for every run."]}, {"t": "reflect", "box": "Reflection 3", "prompt": "<p>State one belief about examples you now hold that you did not at the start, and cite the evidence—your own numbers or a paper—that changed it. Then: what would it take to change it back?</p><p>Finish with: “In my next real task, I will [specific behaviour] when [trigger], and I will judge it by [observable measure].”</p>"}], "core": ["Opening prediction (5)", "Theory 3.1–3.5 with checkpoint, MCQ, misconceptions, checks (25)", "Exercise 3A two strategies, 4 items (10)", "Task 3B one iteration + hold-out (13)", "Self-score + reflection (5)"]}, {"id": 4, "title": "Making Models Reason: Chain-of-Thought and Beyond", "covers": "Week 4: externalised reasoning, self-consistency, deliberate search, faithfulness—and the two model regimes.", "bigq": "If the model writes a perfect explanation for a wrong answer, what did the explanation actually explain?", "slides": [{"t": "objectives", "items": ["Distinguish the two regimes—models that must externalise reasoning as text and models that reason internally—and say what transfers between them.", "Explain, as a tested empirical effect rather than a law, why written intermediate steps improve multi-step accuracy on non-reasoning models.", "Distinguish chain, self-consistency and tree-like methods by shape, cost and the failure each addresses; choose among them for a given task and model.", "Design a prompt that turns a search problem into explicit generate–evaluate–prune steps, and know how that differs from the algorithmic Tree-of-Thoughts.", "Recognise unfaithful reasoning and explain what any visible rationale is and is not evidence of."]}, {"t": "think", "box": "Opening prediction 4", "prompt": "<p>Solve, showing your steps: <em>A bookshop sells a novel for 18 currency units. On Monday it sold 14 copies. On Tuesday it sold twice Monday’s count minus 5. On Wednesday it sold one-third of the Monday–Tuesday total, rounded down. A 10% discount applied to all Wednesday sales. What was Wednesday’s revenue?</em></p><p>Then predict for the model you will use (name it): which condition—answer-only vs. explicit intermediate work—will have lower error over three runs, and name the specific step you expect to fail. If your model is a reasoning model, predict whether the explicit-steps instruction changes anything at all.</p>"}, {"t": "theory", "heading": "4.0 Two regimes: externalised reasoning and internal reasoning", "html": "\n   <p>Everything in this session depends on which kind of model you are using, so the distinction comes first.</p>\n   <p><strong>Non-reasoning (standard) models</strong> produce the answer directly. For them, the techniques in 4.1–4.3—asking for written steps, sampling several answers and voting, prompting a generate–evaluate–prune search—are the main ways to get more structured work done before the answer, and the evidence for them comes from 2022–2023 papers on models of that era.</p>\n   <p><strong>Reasoning models</strong> are post-trained to perform extended internal reasoning before the visible answer, often with a controllable effort or “thinking budget”. Provider guidance for them diverges and changes by release: for some reasoning-model families, explicit chain-of-thought instructions add little or can over-constrain the model’s own reasoning; other providers still support explicit reasoning guidance in selected settings. Follow the documentation for the exact model you use (the Appendix lists the documents consulted for this edition) and verify on an evaluation set. Levers that apply across families: a precise task statement, the reasoning-effort or budget setting, tools for exact computation, and verification of the final answer. Some providers do not expose the raw internal reasoning at all and return a summary instead.</p>\n   <p>Four terms, used consistently from here on: <em>chain-of-thought</em> (a prompting technique that asks a model to write steps before answering); <em>visible reasoning</em> (any step-like text the model emits, whether asked for or not); <em>internal reasoning</em> (computation a reasoning model performs before its visible output, which you may not see); <em>rationale</em> (a short explanation written after an answer, which may or may not reflect how the answer was reached).</p>\n   <p>What transfers across both regimes: decomposing hard problems, verifying answers independently, matching method cost to the failure you actually have, and the epistemic point of 4.4—any visible reasoning is a sample, not a proof. Every experiment in this session asks you to record which regime your model belongs to.</p>"}, {"t": "theory", "heading": "4.1 Why writing the steps helps (non-reasoning models)", "html": "\n   <p>Session 1 offered a simplified model: one decoding step has limited capacity. A problem with four dependent steps—compute Tuesday, sum, divide and floor, discount and multiply—requires each intermediate result before the next. If the model must emit the final number as its <em>first</em> token, there is no visible place to hold those intermediates, and standard models often fail on all but shallow problems. This is a useful intuition for <em>why</em> the following technique works, not an established account of internal computation—and it does not describe reasoning models, which hold intermediate state in reasoning you may not see.</p>\n   <p><strong>Chain-of-Thought prompting</strong> (Wei et al., 2022) breaks the bottleneck: ask the model to write the intermediate steps before the answer. Each written step becomes context for the next prediction, so intermediate results are externalised and reusable. Wei et al. reported, for PaLM-540B on the GSM8K grade-school maths benchmark, a jump from about 18% with standard few-shot prompting to about 57% with chain-of-thought exemplars (historical result). In those 2022 experiments the gains emerged only in the largest models and were largest on multi-step arithmetic and symbolic tasks; that scale threshold describes the models of the time, not current architectures or post-training, where much smaller models reason competently.</p>\n   <p>Kojima et al. (2022) showed that worked exemplars were not necessary for those tasks and models: appending “Let’s think step by step” to a zero-shot prompt (<strong>zero-shot CoT</strong>) took text-davinci-002 from 17.7% to 78.7% on MultiArith (and from 10.4% to 40.7% on GSM8K). Their two-stage recipe—first elicit reasoning, then append “Therefore, the answer (arabic numerals) is” to extract a clean answer—was a useful historical pattern for separating reasoning from the answer you parse on standard models. In current systems, prefer provider-native structured output or a separate answer field where available (Session 5).</p>\n   <p>Two practical corollaries for non-reasoning models. First, the chain must precede the answer; asking for “the answer, then your reasoning” yields a rationale written to fit a guess. Second, the granularity of steps matters: steps that are each simple (one arithmetic operation, one clue checked) are reliable; steps that hide sub-steps are where errors enter. For reasoning models, the equivalent levers are the effort setting and a precise problem statement.</p>"}, {"t": "figure", "caption": "Figure 4.1 — Externalised state (non-reasoning models). Left: a number-first answer leaves no visible place for intermediate results. Right: written steps make each intermediate result part of the context for the next. Reasoning models hold such state internally, which is why the explicit instruction matters less for them.", "notice": ["The chain must come before the answer; a rationale written afterwards is a post-hoc explanation.", "Step granularity should match what the model does reliably—one operation, one clue.", "Every written step is also a debugging foothold—the main reason to want visible steps even when accuracy gains are small."], "svg": "<svg viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#4A5563\"/></marker></defs>\n <text x=\"160\" y=\"28\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Direct answer</text>\n <rect x=\"40\" y=\"45\" width=\"240\" height=\"60\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"160\" y=\"70\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">Tuesday? sum? ÷3 floor? discount? ×price?</text><text x=\"160\" y=\"92\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">all inside one pass</text>\n <path d=\"M160,105 L160,140\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"110\" y=\"140\" width=\"100\" height=\"34\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"160\" y=\"162\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">$216 ✗</text>\n <text x=\"160\" y=\"205\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">undebuggable: no visible step</text>\n <text x=\"530\" y=\"28\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Chain-of-thought</text>\n <rect x=\"400\" y=\"42\" width=\"260\" height=\"26\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"410\" y=\"60\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">Tue = 2×14−5 = 23</text><path d=\"M665,55 C690,55 690,89 665,89\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"400\" y=\"76\" width=\"260\" height=\"26\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"410\" y=\"94\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">Mon+Tue = 37</text><path d=\"M665,89 C690,89 690,123 665,123\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"400\" y=\"110\" width=\"260\" height=\"26\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"410\" y=\"128\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">Wed = ⌊37/3⌋ = 12</text><path d=\"M665,123 C690,123 690,157 665,157\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"400\" y=\"144\" width=\"260\" height=\"26\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"410\" y=\"162\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">price = 18×0.9 = 16.20</text><path d=\"M665,157 C690,157 690,191 665,191\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><rect x=\"400\" y=\"178\" width=\"260\" height=\"26\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"410\" y=\"196\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">12 × 16.20 = 194.40</text>\n <rect x=\"400\" y=\"215\" width=\"120\" height=\"26\" fill=\"#EDF4EF\" stroke=\"#3F7A57\"/><text x=\"460\" y=\"233\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">$194.40 ✓</text>\n <text x=\"600\" y=\"233\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">one pass per step</text>\n </svg>", "alt": "Left, “Direct answer”: a box listing “Tuesday? sum? ÷3 floor? discount? ×price? — all inside one pass” with an arrow to the output “216 ✗”, captioned “undebuggable: no visible step”. Right, “Chain-of-thought”: five boxes in a column, each one operation (Tue = 2×14−5 = 23; Mon+Tue = 37; Wed = ⌊37/3⌋ = 12; price = 18×0.9 = 16.20; 12 × 16.20 = 194.40), each feeding the next, ending in “194.40 ✓” captioned “one pass per step”."}, {"t": "example", "box": "Worked example: direct vs. chain, and where chains fail", "html": "\n   <p><strong>Direct</strong> (“answer with a number only”): a model may output <code>216</code>—plausible, wrong (it forgot the discount), and undebuggable.</p>\n   <p><strong>Chain</strong> (“think step by step, then give the answer”):</p>\n<pre>Monday: 14 copies.\nTuesday: 2 × 14 − 5 = 23 copies.\nMonday + Tuesday: 37 copies.\nWednesday: floor(37 / 3) = 12 copies.\nPrice after 10% discount: 18 × 0.9 = 16.20 (currency units).\nRevenue: 12 × 16.20 = 194.40.\nAnswer: 194.40</pre>\n   <p>Every line is one operation and can be checked. The characteristic chain failures, each visible as a specific wrong line: an <em>arithmetic slip</em> (37/3 → 13); a <em>misread constraint</em> (rounding up); a <em>dropped condition</em> (no discount); a <em>distractor pulled in</em> (using a Thursday figure the problem mentioned but did not ask about). Being able to name the failure is what makes iteration possible.</p>"}, {"t": "predict", "box": "Checkpoint 4", "prompt": "<p>You add to the bookshop problem a sentence: “On Thursday the shop was closed for stocktaking, which cost $250.” Nothing is asked about Thursday. Predict: does the direct answer or the chain answer get worse, and how?</p>", "reveal": "<p>Both conditions can degrade, in different ways. In the direct condition the characteristic failure is an answer that “uses” the distractor (for example subtracting 250). In the stepwise condition the distractor often appears in a step, where it is sometimes incorporated wrongly and sometimes explicitly dismissed. Follow-up work on GSM8K variants with irrelevant context documented the distractor weakness on 2023 models; the rate on your model is something to measure (Exercise 4A), not something to assume. One mitigation to test: make relevance filtering an explicit first step—“list the quantities needed before calculating”.</p>"}, {"t": "theory", "heading": "4.2 Many chains: self-consistency", "html": "\n   <p>A chain is one sample from the model’s distribution over reasoning paths. Wang et al. (2023) proposed <strong>self-consistency</strong>: sample <em>k</em> chains at non-zero temperature, extract each final answer, and return the majority. The rationale is statistical: a problem usually has many valid routes to the correct answer but each wrong answer comes from a different, specific mistake, so correct answers cluster and wrong ones scatter. They reported gains over single-chain CoT of +17.9 points on GSM8K, +11.0 on SVAMP and +12.2 on AQuA (historical result, 2022–2023 models). Benefits show diminishing returns as <em>k</em> grows; tune <em>k</em> against accuracy, latency and cost on your task rather than assuming a plateau.</p>\n   <p>Self-consistency applies only where a final answer can be extracted and compared—numbers, labels, short strings. It does not apply to essays. Its cost is <em>k</em>× tokens and latency, and it does not help when the model’s errors are <em>systematic</em>: if most chains misread the same constraint, the majority is confidently wrong. The vote also gives you a free diagnostic: a 5–5 split says the problem is ambiguous or the model is at its limit, which is often more useful than either answer.</p>"}, {"t": "theory", "heading": "4.3 Deliberate search: Tree-of-Thoughts", "html": "\n   <p>Both chain and self-consistency commit to a path once started; a chain that takes a wrong turn at step 2 cannot back up. For problems where early choices constrain later ones—puzzles, planning, constraint satisfaction, some code design—that is fatal. <strong>Tree-of-Thoughts</strong> (Yao et al., 2023) makes reasoning a search over partial solutions. Four design decisions define an instance:</p>\n   <ol><li><strong>Thought decomposition</strong>: what counts as one step (one equation, one clue, one paragraph plan).</li>\n   <li><strong>Thought generation</strong>: sample several candidate next steps from the current state, either independently or as a list.</li>\n   <li><strong>State evaluation</strong>: ask the model to judge each candidate—“sure / likely / impossible” for reaching the goal, or a numeric score—or to vote among candidates.</li>\n   <li><strong>Search algorithm</strong>: breadth-first (keep the best <em>b</em> states per level) or depth-first with backtracking when a state is judged impossible.</li></ol>\n   <p>On Game of 24 (make 24 from four numbers), GPT-4 with chain-of-thought solved 4% of problems; ToT with breadth 5 solved 74%—on that paper’s setup, with explicit search and evaluation controlled outside the model. This is not the expected gain on arbitrary tasks or current models. The price is dozens of model calls per problem. ToT is therefore reserved for problems that are (a) decomposable into checkable steps, (b) prone to early commitment errors, and (c) valuable enough to justify the cost. In a chat interface you can write a <em>tree-like deliberation prompt</em>: instruct the model to propose several candidates, evaluate each explicitly, discard the failures, and expand only survivors (Lab 4C). This is a cheaper heuristic inspired by ToT, not the same method—the paper’s search runs outside the model across separately generated states, so a single prompt cannot backtrack in the same way.</p>\n   <table><tr><th>Method</th><th>Shape</th><th>Cost</th><th>Failure it addresses</th><th>Failure it does not</th></tr>\n   <tr><td>Chain-of-Thought</td><td>one linear path</td><td>~1–3×</td><td>too much computation for one pass</td><td>wrong turn early; systematic misreading</td></tr>\n   <tr><td>Self-consistency</td><td><em>k</em> paths, majority</td><td><em>k</em>×</td><td>random slips in any one chain</td><td>errors most chains share</td></tr>\n   <tr><td>Tree-of-Thoughts (algorithmic)</td><td>branch, evaluate, prune, outside the model</td><td>≫ <em>k</em>×</td><td>early commitment; needs backtracking</td><td>problems without checkable partial states</td></tr></table>"}, {"t": "figure", "caption": "Figure 4.2 — Three shapes of reasoning. A chain commits to one path; self-consistency samples several and votes; a tree generates candidates, evaluates them, and prunes before going deeper.", "notice": ["Voting removes random slips but not a misreading every chain shares.", "The tree’s power comes from the evaluation step—a bad evaluator prunes the right branch.", "Cost rises steeply left to right; match the method to the failure you actually have."], "svg": "<svg viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#4A5563\"/></marker></defs>\n <g transform=\"translate(30,20)\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Chain</text>\n <circle cx=\"80\" cy=\"45\" r=\"10\" fill=\"#2C5A8A\"/><path d=\"M80,55 L80,78\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"80\" cy=\"90\" r=\"10\" fill=\"#2C5A8A\"/><path d=\"M80,100 L80,123\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"80\" cy=\"135\" r=\"10\" fill=\"#2C5A8A\"/><path d=\"M80,145 L80,168\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"80\" cy=\"180\" r=\"10\" fill=\"#2C5A8A\"/><text x=\"80\" y=\"230\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">1× cost</text></g>\n <g transform=\"translate(220,20)\"><text x=\"110\" y=\"14\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Self-consistency</text>\n <circle cx=\"30\" cy=\"45\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M30,53 L30,80\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"30\" cy=\"90\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M30,98 L30,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"30\" cy=\"135\" r=\"8\" fill=\"#2C5A8A\"/><circle cx=\"70\" cy=\"45\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M70,53 L70,80\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"70\" cy=\"90\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M70,98 L70,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"70\" cy=\"135\" r=\"8\" fill=\"#2C5A8A\"/><circle cx=\"110\" cy=\"45\" r=\"8\" fill=\"#A63D3D\"/><path d=\"M110,53 L110,80\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"110\" cy=\"90\" r=\"8\" fill=\"#A63D3D\"/><path d=\"M110,98 L110,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"110\" cy=\"135\" r=\"8\" fill=\"#A63D3D\"/><circle cx=\"150\" cy=\"45\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M150,53 L150,80\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"150\" cy=\"90\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M150,98 L150,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"150\" cy=\"135\" r=\"8\" fill=\"#2C5A8A\"/><circle cx=\"190\" cy=\"45\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M190,53 L190,80\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"190\" cy=\"90\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M190,98 L190,125\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"190\" cy=\"135\" r=\"8\" fill=\"#2C5A8A\"/>\n <rect x=\"20\" y=\"170\" width=\"180\" height=\"26\" style=\"fill:#fff;stroke:var(--rule);stroke-width:1.2;rx:6\"/><text x=\"110\" y=\"188\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">vote: 216 216 234 216 216</text><text x=\"110\" y=\"230\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">k× cost</text></g>\n <g transform=\"translate(480,20)\"><text x=\"110\" y=\"14\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:13px;fill:var(--ink)\">Tree-of-Thoughts</text>\n <circle cx=\"110\" cy=\"45\" r=\"10\" fill=\"#2C5A8A\"/>\n <path d=\"M110,55 L40,84\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"40\" cy=\"95\" r=\"9\" fill=\"#2C5A8A\"/><path d=\"M110,55 L110,84\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"110\" cy=\"95\" r=\"9\" fill=\"#A63D3D\"/><path d=\"M110,55 L180,84\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"180\" cy=\"95\" r=\"9\" fill=\"#2C5A8A\"/>\n <text x=\"110\" y=\"122\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">✗ pruned</text>\n <path d=\"M40,104 L15,134\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"15\" cy=\"145\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M40,104 L65,134\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"65\" cy=\"145\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M180,104 L155,134\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"155\" cy=\"145\" r=\"8\" fill=\"#2C5A8A\"/><path d=\"M180,104 L205,134\" style=\"stroke:#4A5563;stroke-width:1.4;fill:none;marker-end:url(#ah)\"/><circle cx=\"205\" cy=\"145\" r=\"8\" fill=\"#2C5A8A\"/>\n <text x=\"110\" y=\"185\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">generate → evaluate → keep best b → expand</text><text x=\"110\" y=\"230\" text-anchor=\"middle\" style=\"font-family:var(--sans);font-size:12px;fill:var(--ink-2)\">≫ k× cost</text></g>\n </svg>", "alt": "Three panels. Chain: four nodes in a single vertical line, “1× cost”. Self-consistency: five vertical chains of three nodes; one chain is red; below, a vote box “216 216 234 216 216”, “k× cost”. Tree-of-Thoughts: a root node branching to three children, the middle one red and labelled “✗ pruned”; the two surviving children each branch to two more; caption “generate → evaluate → keep best b → expand”, “≫ k× cost”."}, {"t": "theory", "heading": "4.4 Faithfulness: what a chain is evidence of", "html": "\n   <p>A written chain is persuasive. Turpin et al. (2023) tested whether it is <em>faithful</em>—whether it reflects the actual cause of the model’s answer. They added biasing features to prompts that should not affect the answer: for instance, reordering few-shot examples so that the correct option was always “(A)”, or adding a sentence like “I think the answer is B”. Models shifted their answers toward the bias substantially—accuracy dropped by as much as 36% in the reported experiments—while the chains they wrote never mentioned the bias and instead produced plausible reasons for the biased answer. The reasoning was a post-hoc rationalisation.</p>\n   <p>Two things follow. First, a convincing chain is evidence that the model can produce a convincing chain; it is not evidence that the answer is right or that the stated reasons were operative. Verify final answers by independent means: a calculator, a test case, a second model with a different prompt, self-consistency’s vote. Second, chains remain valuable—they improve accuracy and let you locate errors—so the right stance is “useful but not transparent”. Reasoning models change the cost–benefit of explicit CoT instructions, and some providers return only a summary of internal reasoning; neither changes this epistemic point: any visible reasoning or rationale is a sample, not a proof.</p>"}, {"t": "theory", "heading": "4.5 Decomposition, verification and working with reasoning models", "html": "\n   <p>Chain-of-thought is one member of a family of techniques that give the model more structured work before the answer.</p>\n   <p><strong>Least-to-most prompting</strong> (D. Zhou et al., 2023—a different paper from the Automatic Prompt Engineer of Y. Zhou et al. in Session 5) asks the model first to break a problem into sub-questions ordered from easiest to hardest, then to answer each using the answers to the previous ones. It outperformed plain CoT on tasks requiring generalisation to longer instances than the examples showed, because the decomposition step is explicit rather than implicit in the chain.</p>\n   <p><strong>Program-aided reasoning</strong> (PAL; Gao et al., 2023) has the model write the reasoning as code and hands the arithmetic to an interpreter. The model does what it is good at—translating a word problem into operations—and a calculator does what the model is bad at. On arithmetic benchmarks this removed most of the slip-type errors from Exercise 4A; it is the tool-use pattern of Session 7 applied to reasoning.</p>\n   <p><strong>Self-verification and critique.</strong> After an answer, a second prompt asks the model to check it—recompute, test against the constraints, look for a dropped condition—and to revise if a problem is found. Gains are real but uneven: models are better at catching arithmetic and constraint violations than at noticing they misread the question, and a critique is itself a sample (Session 4.4), so it can confidently approve a wrong answer. Verification against an <em>external</em> check (a test case, a calculator, a second model with a different prompt) is stronger than self-critique alone.</p>\n   <p><strong>Reasoning models (see 4.0).</strong> For these, provider guidance is the authority and changes by release; as of this edition the common advice is: state the task precisely and avoid instructing the model how to think; set the reasoning-effort or budget to match the task’s difficulty and your latency/cost limits; give the model tools for exact computation; and verify the final answer independently. Decide whether to show the user a concise rationale or a verification summary—do not assume raw internal reasoning is available or should be surfaced. The epistemics do not change: whatever reasoning is visible is still a sample, and Turpin et al.’s warning still applies.</p>"}, {"t": "mcq", "q": "Ten sampled solutions to a logic puzzle: eight say “Alice”, two say “Bob”. What can you conclude?", "options": [{"t": "The vote estimates agreement across sampled solutions, not correctness.", "ok": true, "fb": "Voting reduces random slips; it does not detect an error most chains share, such as a misread clue. Check a shared step, or verify independently."}, {"t": "The majority establishes that Alice is correct because eight sampled chains agree.", "ok": false, "fb": "Agreement among a model’s own samples is not evidence of correctness when the error is systematic."}, {"t": "The vote is unusable unless at least one hundred chains have been sampled.", "ok": false, "fb": "More samples help with random error; they do not address shared systematic error."}]}, {"t": "misconceptions", "items": [{"claim": "“Think step by step” makes the model smarter.", "truth": "On non-reasoning models it gives the model a place to externalise intermediate state, and on some tasks that measurably improves accuracy. It cannot supply a capability that is absent; on shallow tasks it adds nothing but tokens; and on reasoning models providers generally advise against it."}, {"claim": "If the model explains its answer, I can trust the answer.", "truth": "Turpin et al.: chains can be fluent rationalisations of answers driven by cues the chain never mentions. Trust comes from verification, not from explanation."}, {"claim": "More sophisticated methods (ToT) are always better.", "truth": "ToT costs dozens of calls and only helps when partial solutions are checkable and early errors are common. For a two-step problem it is waste."}, {"claim": "Asking for the answer first and reasoning after is equivalent.", "truth": "It inverts the mechanism: the answer is a one-pass guess and the reasoning is written to fit it. The chain must come first."}, {"claim": "A single generate–evaluate–prune prompt is Tree-of-Thoughts.", "truth": "It is a tree-like deliberation heuristic. The paper’s method runs the search outside the model across separately generated states, with backtracking the single prompt cannot do."}]}, {"t": "concept", "html": "Written steps convert a one-pass problem into many one-pass problems and store state in text. One chain helps; several chains with a vote remove random slips; a tree with evaluation and pruning handles early wrong turns. None of them makes the written reasoning a faithful account of why the answer was given—verify independently."}, {"t": "check", "items": [{"q": "Explain why “answer with just the number” is harder than “show your steps”, using the fixed-computation principle, and say what kind of problem it does <em>not</em> matter for.", "a": "In the simplified model, a number-first answer leaves no visible place for intermediate results, whereas written steps make each result part of the context for the next. The effect is empirical and model-dependent, and matters least for problems solvable in one step—simple lookups, one-step arithmetic, direct classification—and for reasoning models that hold intermediate state internally."}, {"q": "Give a concrete example of a systematic error self-consistency would not catch, and one experimental way to detect it.", "a": "Every chain interprets ‘rounded down’ as ‘rounded’; all agree on the wrong answer. Detect it by inspecting the shared steps across chains, or by rephrasing the constraint and checking whether the majority changes."}, {"q": "Sketch a ToT decomposition for planning a three-paragraph essay, including what the evaluation step would judge.", "a": "Thought = a one-sentence plan for one paragraph; generate three plans per paragraph; evaluate each for coherence with the thesis and with the previous paragraph (“strong / weak / off-topic”); keep the best two; expand. The evaluation judges fit and non-redundancy, not prose quality. Done inside one prompt this is a tree-like heuristic; done as separate calls with state kept outside the model, it is the algorithmic ToT."}], "gated": true}, {"t": "exercise", "box": "Exercise 4A — Direct vs. stepwise, with error taxonomy", "html": "<p>Run the bookshop problem (with discount) in two conditions—answer-only and explicit-steps—three runs each, sampling on. Then run the distractor variant from 4.2 the same way. Record which regime your model is in (4.0). For every failed run, mark the <em>first</em> wrong line (or, for answer-only, the wrong answer) and code the error before opening the analysis panel: arithmetic slip / misread constraint / dropped condition / distractor pulled in.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "expect": "<p><strong>Analysis template.</strong> Report error rate per condition and variant with run counts and model/version, and the distribution of first-error types. Do not assume the stepwise condition wins: on a reasoning model the two conditions may be indistinguishable, which is itself the finding. Lab 4A (full, take-home) extends to five or more runs and adds a binomial confidence interval per condition.</p>"}, {"t": "exercise", "box": "Lab 4B — Self-consistency by hand", "html": "<p>Pick the distractor problem. Run ten chains at temperature ≈ 0.8. Extract the final answers and tally them. Then inspect the chains that agree with the majority: do they share a step? Inspect the minority: do they share a mistake?</p>", "expect": "<p><strong>Analysis template.</strong> Report vote concentration and whether the majority chains share a step. A wrong majority, a split vote, or a unanimous correct vote are all valid outcomes; each says something different about where the model’s errors come from.</p>", "lab": true}, {"t": "task", "box": "Lab 4C — Build a tree-like deliberation prompt", "html": "<p>The course pack contains one fixed five-clue 4-digit lock puzzle (clues of the form “exactly one digit is correct and in the right place / correct but in the wrong place / no digits correct”) with its solution hidden until submission. Do <strong>not</strong> ask the model for the answer. Write a single prompt that instructs it to: (1) propose three candidate partial assignments for the first two digits; (2) check each against every clue and mark “consistent” or “violates clue #n”; (3) discard violators; (4) extend survivors to the next digit and repeat; (5) show the tree with pruned branches marked.</p><p>Before running, sketch the first level by hand. After, mark where the model’s tree diverged from yours and decide, clue by clue, who was wrong. Report how many model evaluations were incorrect (a wrong “consistent” or “violates”). Note: this is a tree-like heuristic in one prompt; Stretch 4E compares it with separate calls.</p> <p class=\"materials\">Materials: fictional data only, from the course pack (see References → Materials pack). Record the model name and version, sampling settings and whether tools/browsing were off before you start.</p>", "lab": true}, {"t": "exercise", "box": "Lab 4D — A partial classroom replication of unfaithful reasoning", "html": "<p>Use the balanced multiple-choice set from the course pack. Condition A (biased): the five preceding examples all have the correct answer at position (A); the sixth question’s correct answer is (C). Condition B (control): the same questions with the example answers randomised. Ask for step-by-step reasoning (or, on a reasoning model, for a brief rationale). Three runs each.</p><p>Before running, predict the (A) rate under each condition. Score the answer shift and, separately, whether any rationale names the position pattern. Label the write-up a partial classroom replication, not a reproduction of Turpin et al.</p> <p class=\"materials\">Materials: fictional data only,
