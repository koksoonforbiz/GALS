function textGate(box,key,type,onSaved){
  const ta=el("textarea");ta.placeholder=type==="think"?"Write your prediction before reading on…":type==="predict"?"Commit to a prediction, then reveal…":"Write your reflection…";
  ta.value=state.answers[key]||"";
  const act=el("div","actions");
  const btn=el("button","btn",type==="think"?"Save prediction and continue":type==="predict"?"Save and reveal":"Save reflection");btn.type="button";
  const status=el("span","status",state.answers[key]?"Saved":"");if(state.answers[key])status.classList.add("ok");
  btn.addEventListener("click",()=>{
    if(ta.value.trim().length<20){status.textContent="Write at least a sentence first.";status.classList.remove("ok");return;}
    state.answers[key]=ta.value;logEvent(type+"_submitted",{slide:key,chars:ta.value.length});save();
    status.textContent="Saved";status.classList.add("ok");onSaved&&onSaved();
  });
  act.appendChild(btn);act.appendChild(status);box.appendChild(ta);box.appendChild(act);
}
function render(){
  COURSE.forEach(sess=>{
    const total=sess.slides.length+1;
    const st=el("section","slide sec-title");st.dataset.id=`s${sess.id}-0`;st.dataset.session=sess.id;
    const label=sess.appendix?"Appendix":`Session ${sess.id}`;
    st.innerHTML=`<div class="slide-inner"><div class="slide-label"><b>${label}</b><span class="num">1 / ${total}</span></div>
      <h2>${sess.title}</h2><div class="covers">Covers ${sess.covers}</div><p class="big-q">${sess.bigq}</p>
      ${sess.appendix?"":`<div class="rhythm"><div><b>Activate</b><i>5 min · commit to a prediction</i></div><div><b>Theory</b><i>25 min · read, predict, check</i></div><div><b>Apply</b><i>20–25 min · core experiments (labs are take-home)</i></div><div><b>Reflect</b><i>5 min · score and transfer</i></div></div>
      <div class="core"><b>60-minute core path</b><ol>${(sess.core||[]).map(x=>`<li>${x}</li>`).join("")}</ol><span>Everything labelled Lab or Stretch is take-home.</span></div>`}</div>`;
    deck.appendChild(st);slides.push(st);
    sess.slides.forEach((s,i)=>{
      const sec=el("section","slide"+(s.t==="figure"?" fig-slide":""));const key=`s${sess.id}-${i+1}`;sec.dataset.id=key;sec.dataset.session=sess.id;
      const inner=el("div","slide-inner");
      inner.appendChild(el("div","slide-label",`<b>${sess.appendix?"Appendix":"Session "+sess.id}</b><span class="${s.lab?"lab-tag":""}">${s.lab?"Lab · take-home":PHASE[s.t]}</span><span class="num">${i+2} / ${total}</span>`));
      switch(s.t){
        case "objectives": inner.appendChild(el("h2",null,"Learning objectives"));inner.appendChild(el("p",null,"By the end of this session you will be able to:"));inner.appendChild(el("ul",null,s.items.map(x=>`<li>${x}</li>`).join(""))); break;
        case "theory": inner.appendChild(el("h2",null,s.heading));inner.appendChild(el("div",null,s.html)); break;
        case "figure": { const f=el("figure","fig");const fs=el("div","fig-svg",s.svg);fs.setAttribute("role","img");fs.setAttribute("aria-label",s.caption.replace(/<[^>]+>/g,""));f.appendChild(fs);f.appendChild(el("figcaption",null,s.caption));if(s.alt){const d=el("details","fig-alt");d.innerHTML=`<summary>Text description of this figure</summary><p>${s.alt}</p>`;f.appendChild(d);}if(s.notice){f.appendChild(el("div","fig-notice","<b>What to notice</b><ul>"+s.notice.map(x=>"<li>"+x+"</li>").join("")+"</ul>"));}inner.appendChild(f); break; }
        case "example": case "task": case "ai": case "stretch": { const b=el("div",`box ${s.t}`);b.appendChild(el("div","box-title",s.box));b.appendChild(el("div",null,s.html));inner.appendChild(b); break; }
        case "concept": { inner.appendChild(el("h2",null,"Key idea"));const b=el("div","box concept");b.appendChild(el("p",null,s.html));inner.appendChild(b); break; }
        case "check": { inner.appendChild(el("h2",null,"Pause and check"));inner.appendChild(el("p",null,"Write 1–3 sentences for each question; the answer unlocks once your response is saved."));const b=el("div","box check");
          s.items.forEach((it,k)=>{const qk=key+"-q"+(k+1);const qa=el("div","qa");qa.innerHTML=`<div class="q">${k+1}. ${it.q}</div><textarea class="mini" placeholder="Your answer…"></textarea><div class="actions"><button type="button" class="btn secondary save">Save answer</button><button type="button" class="show" disabled>Show answer</button><span class="status"></span></div><div class="a">${it.a}<div class="after"><label>What I missed or would change:</label><textarea class="mini short" placeholder="One sentence…"></textarea><button type="button" class="btn secondary savemiss">Save</button></div></div>`;
            const ta=qa.querySelector("textarea.mini"),sv=qa.querySelector(".save"),sh=qa.querySelector(".show"),stt=qa.querySelector(".status");
            if(state.answers[qk]){ta.value=state.answers[qk];sh.disabled=false;stt.textContent="Saved";}
            sv.addEventListener("click",()=>{if(ta.value.trim().length<10){stt.textContent="Write at least a sentence first.";return;}state.answers[qk]=ta.value;logEvent("check_answered",{slide:key,question:k+1,chars:ta.value.length});save();sh.disabled=false;stt.textContent="Saved";});
            sh.addEventListener("click",()=>{const open=qa.classList.toggle("open");sh.textContent=open?"Hide answer":"Show answer";if(open)logEvent("check_revealed",{slide:key,question:k+1});});
            const miss=qa.querySelector(".short");miss.value=state.answers[qk+"-miss"]||"";qa.querySelector(".savemiss").addEventListener("click",()=>{state.answers[qk+"-miss"]=miss.value;logEvent("check_missed_noted",{slide:key,question:k+1,chars:miss.value.length});save();});
            b.appendChild(qa);});
          inner.appendChild(b); break; }
        case "think": case "reflect": { const b=el("div",`box ${s.t==="think"?"think":"task"}`);b.appendChild(el("div","box-title",s.box));b.appendChild(el("div",null,s.prompt));
          textGate(b,key,s.t,()=>{if(s.t==="think")go(slides.indexOf(sec)+1);});
          if(s.t==="think")b.appendChild(el("div","locked-note","The theory that follows is more useful once you have committed to a prediction."));inner.appendChild(b); break; }
        case "predict": { const b=el("div","box predict");b.appendChild(el("div","box-title",s.box));b.appendChild(el("div",null,s.prompt));const rev=el("div","reveal",s.reveal);
          textGate(b,key,"predict",()=>{rev.classList.add("open");logEvent("predict_revealed",{slide:key});});if(state.answers[key])rev.classList.add("open");b.appendChild(rev);inner.appendChild(b); break; }
        case "mcq": { inner.appendChild(el("h2",null,"Check your reasoning"));const m=el("div","mcq");m.appendChild(el("p",null,s.q));
          const why=el("textarea","mini");why.placeholder="Before choosing: in one sentence, what principle decides this?";why.value=state.answers[key+"-why"]||"";m.appendChild(why);
          const wa=el("div","actions");const wb=el("button","btn secondary","Save reasoning and unlock options");wb.type="button";const ws=el("span","status","");wa.appendChild(wb);wa.appendChild(ws);m.appendChild(wa);
          const fb=el("div","fb");let answered=false;let seed=0;for(const ch of key)seed=(seed*31+ch.charCodeAt(0))>>>0;
          const order=s.options.map((o,i)=>i).sort((a,b)=>((seed*(a+7))%97)-((seed*(b+7))%97));
          const btns=[];order.forEach(k=>{const o=s.options[k];const btn=el("button","opt",o.t);btn.type="button";btn.disabled=!state.answers[key+"-why"];btns.push(btn);btn.addEventListener("click",()=>{if(answered)return;answered=true;btn.classList.add(o.ok?"right":"wrong");
            if(!o.ok)btns.forEach((x,j)=>{if(s.options[order[j]].ok)x.classList.add("right");});
            fb.innerHTML=(o.ok?"<strong>Correct.</strong> ":"<strong>Not quite.</strong> ")+o.fb;fb.classList.add("show");logEvent("mcq_answered",{slide:key,option:k+1,correct:o.ok});});m.appendChild(btn);});
          wb.addEventListener("click",()=>{if(why.value.trim().length<15){ws.textContent="Write one sentence first.";return;}state.answers[key+"-why"]=why.value;logEvent("mcq_rationale",{slide:key,chars:why.value.length});save();btns.forEach(b=>b.disabled=false);ws.textContent="Options unlocked";});
          m.appendChild(fb);inner.appendChild(m); break; }
        case "misconceptions": { inner.appendChild(el("h2",null,"Common misconceptions"));const m=el("div","misc");m.appendChild(el("p","hint","For each claim: choose Agree or Disagree and give a reason. The explanation unlocks once both are saved."));
          s.items.forEach((it,k)=>{const ik=key+"-m"+(k+1);const d=el("div","item");d.innerHTML=`<div class="claim">${it.claim}</div><div class="commit"><button type="button" data-v="agree">Agree</button><button type="button" data-v="disagree">Disagree</button><input type="text" placeholder="because…"><button type="button" class="btn secondary reveal-btn" disabled>Reveal</button></div><div class="truth">${it.truth}<div class="after"><label>Did your reason change?</label><button type="button" data-c="yes">Yes</button><button type="button" data-c="no">No</button></div></div>`;
            const saved=state.answers[ik]||{};let choice=saved.choice||null;const inp=d.querySelector("input"),rb=d.querySelector(".reveal-btn");inp.value=saved.because||"";
            const vb=d.querySelectorAll(".commit button[data-v]");const upd=()=>{vb.forEach(b=>b.classList.toggle("sel",b.dataset.v===choice));rb.disabled=!(choice&&inp.value.trim().length>=8);};
            vb.forEach(b=>b.addEventListener("click",()=>{choice=b.dataset.v;upd();}));inp.addEventListener("input",upd);upd();
            rb.addEventListener("click",()=>{state.answers[ik]={choice,because:inp.value};logEvent("misconception_committed",{slide:key,item:k+1,choice,chars:inp.value.length});save();d.classList.add("open");logEvent("misconception_opened",{slide:key,item:k+1});});
            if(saved.choice&&saved.revealed)d.classList.add("open");
            d.querySelectorAll(".after button").forEach(b=>b.addEventListener("click",()=>{state.answers[ik]=Object.assign(state.answers[ik]||{},{changed:b.dataset.c,revealed:true});logEvent("misconception_changed",{slide:key,item:k+1,changed:b.dataset.c});save();d.querySelectorAll(".after button").forEach(x=>x.classList.toggle("sel",x===b));}));
            m.appendChild(d);});
          inner.appendChild(m); break; }
        case "exercise": { const b=el("div","box ai");b.appendChild(el("div","box-title",s.box));b.appendChild(el("div",null,s.html));
          b.appendChild(el("div","res-label","Record your results here (numbers, run counts, model/version) before opening the analysis template."));
          const ta=el("textarea");ta.placeholder="Results…";ta.value=state.answers[key]||"";b.appendChild(ta);
          const act=el("div","actions");const sv=el("button","btn","Save results");sv.type="button";const btn=el("button","btn secondary","Open analysis template");btn.type="button";btn.disabled=!state.answers[key];const stt=el("span","status",state.answers[key]?"Saved":"");const rev=el("div","reveal",s.expect);
          sv.addEventListener("click",()=>{if(ta.value.trim().length<20){stt.textContent="Record your results first (a few lines).";return;}state.answers[key]=ta.value;logEvent("results_submitted",{slide:key,chars:ta.value.length});save();stt.textContent="Saved";btn.disabled=false;});
          btn.addEventListener("click",()=>{const open=rev.classList.toggle("open");btn.textContent=open?"Hide analysis template":"Open analysis template";if(open)logEvent("expect_revealed",{slide:key});});
          act.appendChild(sv);act.appendChild(btn);act.appendChild(stt);b.appendChild(act);b.appendChild(rev);inner.appendChild(b); break; }
        case "selfscore": { inner.appendChild(el("h2",null,"Score yourself"));inner.appendChild(el("p",null,"0 = not done · 1 = partly · 2 = fully. Be honest; this is for you and for the study, not a grade."));
          const box=el("div","box task score");const tbl=el("table");const saved=state.scores[key]||{};
          s.criteria.forEach((c,k)=>{const tr=el("tr");tr.innerHTML=`<td>${c}</td><td>${[0,1,2].map(v=>`<label><input type="radio" name="${key}-${k}" value="${v}" ${saved[k]==v?"checked":""}> ${v}</label>`).join("")}</td>`;tbl.appendChild(tr);});
          const tot=el("div","total");const upd=()=>{const sc=state.scores[key]||{};let sum=0;s.criteria.forEach((c,k)=>{if(sc[k]!=null)sum+=Number(sc[k]);});tot.textContent=`Total: ${sum} / ${s.criteria.length*2}`;};
          tbl.addEventListener("change",e=>{const k=e.target.name.split("-").pop();state.scores[key]=state.scores[key]||{};state.scores[key][k]=e.target.value;logEvent("selfscore_set",{slide:key,criterion:Number(k)+1,value:Number(e.target.value)});save();upd();});
          box.appendChild(tbl);box.appendChild(tot);upd();inner.appendChild(box); break; }
      }
      sec.appendChild(inner);deck.appendChild(sec);slides.push(sec);
    });
    const nb=el("button",null,`${sess.appendix?"Appendix":"Session "+sess.id}: ${sess.title}<span>${total} slides</span>`);
    nb.addEventListener("click",()=>{go(slides.indexOf(st));document.getElementById("rail").classList.remove("open");});nav.appendChild(nb);
  });
}
render();
let current=0;
function go(i){i=Math.max(0,Math.min(slides.length-1,i));slides[i].scrollIntoView({block:"start"});}
document.getElementById("prevBtn").addEventListener("click",()=>go(current-1));
document.getElementById("nextBtn").addEventListener("click",()=>go(current+1));
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("rail").classList.toggle("open"));
document.addEventListener("keydown",e=>{if(["TEXTAREA","INPUT"].includes(e.target.tagName))return;
  if(["ArrowDown","j"," ","PageDown"].includes(e.key)){e.preventDefault();go(current+1);}
  if(["ArrowUp","k","PageUp"].includes(e.key)){e.preventDefault();go(current-1);}});
const counter=document.getElementById("counter"),bar=document.getElementById("progressBar"),done=document.getElementById("doneCount");
function updateChrome(){counter.textContent=`Slide ${current+1} of ${slides.length}`;bar.style.width=((current+1)/slides.length*100)+"%";
  const sid=slides[current].dataset.session;nav.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("active",String(COURSE[k].id)===sid));
  done.textContent=`${Object.keys(state.viewed).length} of ${slides.length} slides viewed`;}
const io=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting&&en.intersectionRatio>=0.6){const i=slides.indexOf(en.target);
  if(i!==current){current=i;const id=en.target.dataset.id;if(!state.viewed[id])state.viewed[id]=new Date().toISOString();logEvent("slide_viewed",{slide:id});updateChrome();}}});},{root:deck,threshold:[0.6]});
slides.forEach(s=>io.observe(s));
if(!state.viewed[slides[0].dataset.id]){state.viewed[slides[0].dataset.id]=new Date().toISOString();logEvent("slide_viewed",{slide:slides[0].dataset.id});}
updateChrome();
document.getElementById("dlLog").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),answers:state.answers,scores:state.scores,viewed:state.viewed,log:state.log},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="prompt-course-activity-log.json";a.click();});
document.getElementById("resetLog").addEventListener("click",()=>{if(confirm("Clear all saved answers, scores and the activity log on this device?")){state={answers:{},viewed:{},log:[],scores:{}};save();location.reload();}});
</script>
